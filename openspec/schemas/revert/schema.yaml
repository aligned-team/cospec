# generated by cospec — do not edit here.
# Customize via openspec/config.yaml (context, rules); full ownership: `openspec schema fork revert <name>`.
name: revert
version: 2
description: 'revert — roll back a shipped change. Workflow: proposal (+ Reverts) → blocking-changes → tasks'
artifacts:
  - id: proposal
    generates: proposal.md
    description: What is being rolled back and why
    template: proposal.md
    instruction: |
      Write the proposal for a REVERT (conventional-commit type: revert). State why
      the original is being rolled back and what re-landing it would require.
      Sections: ## Why (at least two sentences), ## What Changes (what returns to
      the prior state), ## Reverts (a backticked archived change slug and/or a
      7–40-hex commit hash), ## Impact (files, APIs affected).
    requires: []
  - id: blocking-changes
    generates: blocking-changes.md
    description: Cross-change dependency ledger — which changes must ship first
    template: blocking-changes.md
    instruction: |
      Determine which other openspec changes must ship before this one.
      PROCESS — do all of these before writing the artifact:
      1. Read this change's proposal.md for everything it consumes (modules,
         files, schemas, endpoints, business/safety prerequisites).
      2. Scan EVERY active change in openspec/changes/ — read each proposal.md
         ("What Changes" at minimum) to map what each change PROVIDES.
      3. Scan openspec/changes/archive/ for already-shipped providers.
      4. Classify each dependency: **Blocked by** (hard — this change cannot
         function without it) vs **Soft-blocked by** (works, but degrades).
      5. Confirm the list with the user before finalizing.
      FORMAT (machine-parsed — deviations fail `cospec validate`):
      - entry:    - [ ] `change-slug` — what it provides
      - shipped:  - [x] `change-slug` — what it provides *(archived YYYY-MM-DD)*
      - empty section: the literal line `None.`
      Extra sections (## Siblings, ## Phase Gates, …) are allowed and ignored by
      the gate. `cospec sync-blockers` keeps checkboxes current; `cospec apply`
      hard-gates on this file.
    requires: [proposal]
  - id: specs
    generates: 'specs/**/*.md'
    description: Inverse delta specs — only if the reverted change carried specs
    template: spec.md
    instruction: |
      If the reverted change carried spec deltas, write the INVERSE deltas (REMOVE
      what it ADDED, restore what it MODIFIED) so the living specs match reality.
      One delta file per capability named in the proposal, at
      specs/<capability>/spec.md. Delta operations use
      ## ADDED/MODIFIED/REMOVED/RENAMED Requirements headers. Each requirement:
      `### Requirement: <name>` with SHALL/MUST normative text. Each scenario:
      `#### Scenario: <name>` — EXACTLY four hashtags (`cospec validate` rejects
      three) — with WHEN/THEN bullets. MODIFIED must carry the full updated
      requirement content. MODIFIED/RENAMED/REMOVED may only target requirements
      that exist in openspec/specs/<capability>/spec.md — `cospec validate`
      checks this so archive cannot fail on it later.
    requires: [proposal]
  - id: verification
    generates: verification.md
    description: Acceptance-evidence ledger — each observable behavior, the layer it is exercised at, who runs the check, and the recorded evidence
    template: verification.md
    instruction: |
      Optional for a revert — reverts are often urgent rollbacks. Author it when the
      revert touches a live surface (check the proposal's ## Surfaces): prove the
      symptom is gone with at least one row of any layer. Rows: `- [ ] N.M @<layer>
      (<owner>) <probe> -> <result>`; layers @unit @integration @e2e @manual @runtime
      @regression @equivalence @benchmark @eval. A `[x]` row needs observed evidence
      after ` -> `; defer as `[~] … -> defer: <reason>`.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Implementation checklist tracked during apply
    template: tasks.md
    instruction: |
      One group: revert the change, then verify (tests/build green). Use `## N.
      Group` and `- [ ] N.M task` exactly — the checkbox format is parsed.
    requires: [proposal]
apply:
  requires: [proposal, blocking-changes, tasks]
  tracks: tasks.md
  instruction: |
    BEFORE any implementation work, run:
        cospec apply "<change>" --json
    - exit 0 → gate clear. Read the returned contextFiles, work through pending
      tasks in order, marking each `- [x]` as you complete it.
    - exit 2 → BLOCKED (missing artifacts or unchecked hard blockers). STOP.
      Report each item the command lists and what it provides; suggest
      implementing and archiving those first. Do NOT proceed or work around it.
    - exit 3 → soft-blocked. List each soft blocker and what degrades without
      it, ask the user to confirm, then re-run with --allow-soft. Never skip
      silently.
    The command auto-checks entries whose blocker is already archived — trust
    its output over a manual read of blocking-changes.md. Pause on ambiguity,
    errors, or scope creep.

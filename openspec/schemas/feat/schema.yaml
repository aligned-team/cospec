# generated by cospec — do not edit here.
# Customize via openspec/config.yaml (context, rules); full ownership: `cospec schema fork feat <name>`.
name: feat
version: 2
description: 'feat — a new feature. Full workflow: proposal → blocking-changes, specs (+ design) → tasks'
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why this feature exists, what changes, which capabilities it touches
    template: proposal.md
    instruction: |
      Write the proposal for a NEW FEATURE (conventional-commit type: feat).
      Sections: ## Why (motivation, at least two sentences), ## What Changes,
      ## Capabilities (### New Capabilities / ### Modified Capabilities — each
      name is a capability path relative to specs/, kebab-case per segment, and
      maps to specs/<capability-path>/spec.md; follow the project's existing
      layout and reuse an existing capability's path verbatim), ## Impact (files,
      APIs, migrations; mark breaking changes with BREAKING).
      If while writing this you realize the work is really a fix/refactor/etc.,
      stop and re-create the change: `cospec new <correct-type> <slug>`.
    requires: []
  - id: blocking-changes
    generates: blocking-changes.md
    description: Cross-change dependency ledger — which changes must ship first
    template: blocking-changes.md
    instruction: |
      Determine which other openspec changes must ship before this one.
      PROCESS — do all of these before writing the artifact:
      1. Read this change's proposal.md for everything it consumes (modules,
         files, schemas, endpoints, business/safety prerequisites).
      2. Scan EVERY active change in openspec/changes/ — read each proposal.md
         ("What Changes" at minimum) to map what each change PROVIDES.
      3. Scan openspec/changes/archive/ for already-shipped providers.
      4. Classify each dependency: **Blocked by** (hard — this change cannot
         function without it) vs **Soft-blocked by** (works, but degrades).
      5. Confirm the list with the user before finalizing.
      FORMAT (machine-parsed — deviations fail `cospec validate`):
      - entry:    - [ ] `change-slug` — what it provides
      - shipped:  - [x] `change-slug` — what it provides *(archived YYYY-MM-DD)*
      - empty section: the literal line `None.`
      Extra sections (## Siblings, ## Phase Gates, …) are allowed and ignored by
      the gate. `cospec sync-blockers` keeps checkboxes current; `cospec apply`
      hard-gates on this file.
    requires: [proposal]
  - id: specs
    generates: 'specs/**/*.md'
    description: Delta specs for every new or modified capability
    template: spec.md
    instruction: |
      One delta file per capability named in the proposal, at
      specs/<capability-path>/spec.md. `<capability-path>` is the spec directory
      relative to specs/ — one segment for a flat layout (`user-auth`), more when
      the project nests (`identity/user-auth`). Preserve the whole path: a new
      capability keeps the exact path the proposal gave it (every newly introduced
      segment kebab-case, following the project's existing organisation — do not
      add a domain level to a flat layout), and a modified capability reuses its
      existing path verbatim rather than moving or renaming it.

      Delta operations use ## ADDED/MODIFIED/REMOVED/RENAMED Requirements headers.
      Each requirement: `### Requirement: <name>` with SHALL/MUST normative text.
      Each scenario: `#### Scenario: <name>` — EXACTLY four hashtags (`cospec
      validate` rejects three) — with WHEN/THEN bullets. MODIFIED must carry the
      full updated requirement content.

      MODIFIED/RENAMED/REMOVED may only target requirements that exist in the
      living spec at <planningHome.root>/openspec/specs/<capability-path>/spec.md —
      `cospec validate` checks this so archive cannot fail on it later.
      `planningHome.root` comes from the `cospec instructions … --json` response;
      always use it instead of a repo-relative path. It resolves to the store when
      the change lives in one (from `--store`, a project `store:` pointer, or a
      global default store) and to this repository otherwise — the field has
      already worked out which.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Technical decisions (optional — create when architecture, data model, or migration is non-trivial)
    template: design.md
    instruction: |
      Create design.md when the change involves cross-cutting architecture, new
      external dependencies, data-model or migration complexity, or
      implementation-blocking ambiguity. Sections: ## Context,
      ## Goals / Non-Goals, ## Decisions (each with the alternative rejected and
      why), ## Risks / Trade-offs ([Risk] → Mitigation). Decisions, not restated
      requirements.

      Design covers HOW; the proposal already covers why and what, and the specs
      cover the requirements. Reference them instead of restating them — Context
      carries only the current state and constraints the approach needs, and
      Goals / Non-Goals adds design-level boundaries rather than repeating the
      proposal's scope. If a section would only restate another artifact, point at
      it instead.

      An ## Open Questions section (omit it if empty) is for unknowns that can
      safely be answered later without changing the specs, the approach, or the
      task breakdown. A question that would change any of those is not deferrable:
      resolve it with the user now rather than guessing or listing it.
    requires: [proposal]
  - id: verification
    generates: verification.md
    description: Acceptance-evidence ledger — each observable behavior, the layer it is exercised at, who runs the check, and the recorded evidence
    template: verification.md
    instruction: |
      Plan an acceptance-evidence ledger BEFORE implementing. Each `## N. <behavior>`
      is one observable behavior; mark the ones whose breakage ships a broken product
      `[critical]`. EVERY `[critical]` group must carry at least one row whose layer is
      NOT @unit — an @integration/@e2e/@manual/@runtime proof at the layer that matters
      (green unit tests are not acceptance). Rows: `- [ ] N.M @<layer> (<owner>) <probe>
      -> <result>`. Layers: @unit @integration @e2e @manual @runtime @regression
      @equivalence @benchmark @eval; owner (agent)/(human), @manual defaults to (human).
      A `[x]` row needs observed evidence after ` -> `; defer as `[~] … -> defer:
      <reason>`. Archive refuses any bare `[ ]` row.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Implementation checklist tracked during apply
    template: tasks.md
    instruction: |
      Follow the template exactly: `## N. Group` headings, `- [ ] N.M task`
      checkboxes. The apply phase parses this checkbox format; non-conforming
      lines are not tracked and fail `cospec validate`. Order tasks by dependency.
      Every task states how its own completion is verified — a test, a command, an
      observable behavior, or a delivered artifact — inside that task's checkbox
      description. Reserve a separate verification task for integration or system
      behavior that spans several implementation tasks, not for checking one task
      you just wrote.
    requires: [proposal, specs]
apply:
  requires: [proposal, blocking-changes, specs, verification, tasks]
  tracks: tasks.md
  instruction: |
    BEFORE any implementation work, run:
        cospec apply "<change>" --json
    - exit 0 → gate clear. Read the returned contextFiles, work through pending
      tasks in order, marking each `- [x]` as you complete it.
    - exit 2 → BLOCKED (missing artifacts or unchecked hard blockers). STOP.
      Report each item the command lists and what it provides; suggest
      implementing and archiving those first. Do NOT proceed or work around it.
    - exit 3 → soft-blocked. List each soft blocker and what degrades without
      it, ask the user to confirm, then re-run with --allow-soft. Never skip
      silently.
    The command auto-checks entries whose blocker is already archived — trust
    its output over a manual read of blocking-changes.md. Pause on ambiguity,
    errors, or scope creep.

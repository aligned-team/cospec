# Pinned OpenSpec surfaces cospec does not reach yet, each tagged with the
# change that implements it (`owner`). Read by reachability.test.ts, which
# fails on an untagged entry, an entry whose surface the pinned binary no
# longer has, an entry the command table does not mark pending for the same
# owner, and a table surface marked pending with no entry here. The change
# that implements a surface deletes its entry in the same commit. Also read by
# the docs data loader (apps/docs/.vitepress/parity.data.ts).
#
# Entry kinds:
#   command           a command path; covers its whole subtree
#   flag              a flag on a command path; covers the flag's values
#   positional        a positional slot (by index) on a command path
#   positional-value  one value of a positional slot
#   tool              an AI_TOOLS id
#   tool-alias        a TOOL_ID_ALIASES key (`target` is the id it maps to)
# `source: cli` marks a hidden surface the four registry sources cannot
# produce; the test verifies it against the pinned binary instead.

# --- workflow-profiles ------------------------------------------------------------
- { kind: flag, path: [init], flag: --language, owner: workflow-profiles }

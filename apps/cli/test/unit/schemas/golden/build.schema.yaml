# generated by cospec — do not edit here.
# Customize via openspec/config.yaml (context, rules); full ownership: `openspec schema fork build <name>`.
name: build
version: 2
description: 'build — a dependency or build-config change. Light workflow: proposal → blocking-changes → tasks'
artifacts:
  - id: proposal
    generates: proposal.md
    description: One-paragraph why + what for a build or dependency change
    template: proposal.md
    instruction: |
      This is a build/dependency change (manifests, lockfiles, build config) — no
      application source or specs. Keep it short: ## Why — one or two sentences.
      ## What Changes — name each manifest/lockfile touched. ## Impact — build,
      install, or release steps affected.
    requires: []
  - id: blocking-changes
    generates: blocking-changes.md
    description: Cross-change dependency ledger
    template: blocking-changes.md
    instruction: |
      Most build changes are independent. Quickly scan the NAMES of active changes
      in openspec/changes/ for obvious collisions with the manifests and lockfiles
      this change touches — do NOT read every proposal. If nothing collides,
      write `None.` under both sections and move on.
      FORMAT (machine-parsed — deviations fail `cospec validate`):
      - entry:    - [ ] `change-slug` — what it provides
      - shipped:  - [x] `change-slug` — what it provides *(archived YYYY-MM-DD)*
      - empty section: the literal line `None.`
    requires: [proposal]
  - id: verification
    generates: verification.md
    description: Acceptance-evidence ledger — each observable behavior, the layer it is exercised at, who runs the check, and the recorded evidence
    template: verification.md
    instruction: |
      Optional and light — a trivial pin needs none. Author it only when the
      proposal checks the `deploy` surface (deploy/runtime/CI-execution topology):
      then include at least one `@runtime` row proving the artifact runs in its real
      runtime (right binary arch, config path, env-var type, secret present). Rows:
      `- [ ] N.M @<layer> (<owner>) <probe> -> <result>`. A `[x]` row needs observed
      evidence after ` -> `; defer as `[~] … -> defer: <reason>`.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Implementation checklist tracked during apply
    template: tasks.md
    instruction: |
      Include a lockfile-regeneration task where applicable. `## N. Group` +
      `- [ ] N.M task` exactly — the checkbox format is parsed.
    requires: [proposal]
apply:
  requires: [proposal, blocking-changes, tasks]
  tracks: tasks.md
  instruction: |
    BEFORE any implementation work, run:
        cospec apply "<change>" --json
    - exit 0 → gate clear. Read the returned contextFiles, work through pending
      tasks in order, marking each `- [x]` as you complete it.
    - exit 2 → BLOCKED (missing artifacts or unchecked hard blockers). STOP.
      Report each item the command lists and what it provides; suggest
      implementing and archiving those first. Do NOT proceed or work around it.
    - exit 3 → soft-blocked. List each soft blocker and what degrades without
      it, ask the user to confirm, then re-run with --allow-soft. Never skip
      silently.
    The command auto-checks entries whose blocker is already archived — trust
    its output over a manual read of blocking-changes.md. Pause on ambiguity,
    errors, or scope creep.

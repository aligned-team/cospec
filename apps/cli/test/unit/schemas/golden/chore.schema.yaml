# generated by cospec — do not edit here.
# Customize via openspec/config.yaml (context, rules); full ownership: `cospec schema fork chore <name>`.
name: chore
version: 2
description: 'chore — maintenance not affecting src or tests. Light workflow: proposal → blocking-changes → tasks'
artifacts:
  - id: proposal
    generates: proposal.md
    description: One-paragraph why + what for a maintenance change
    template: proposal.md
    instruction: |
      This is a maintenance chore not affecting application source or tests. Keep it
      short: ## Why — one or two sentences. ## What Changes — bulleted list of what
      you touched. ## Impact — anything downstream that notices.
    requires: []
  - id: blocking-changes
    generates: blocking-changes.md
    description: Cross-change dependency ledger
    template: blocking-changes.md
    instruction: |
      Most chore changes are independent. Quickly scan the NAMES of active changes
      in openspec/changes/ for obvious collisions with the files
      this change touches — do NOT read every proposal. If nothing collides,
      write `None.` under both sections and move on.
      FORMAT (machine-parsed — deviations fail `cospec validate`):
      - entry:    - [ ] `change-slug` — what it provides
      - shipped:  - [x] `change-slug` — what it provides *(archived YYYY-MM-DD)*
      - empty section: the literal line `None.`
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Implementation checklist tracked during apply
    template: tasks.md
    instruction: |
      Follow the template exactly: `## N. Group` headings, `- [ ] N.M task`
      checkboxes. The apply phase parses this checkbox format; non-conforming
      lines are not tracked and fail `cospec validate`. Order tasks by dependency.
      Every task states how its own completion is verified — a test, a command, an
      observable behavior, or a delivered artifact — inside that task's checkbox
      description. Reserve a separate verification task for integration or system
      behavior that spans several implementation tasks, not for checking one task
      you just wrote.
    requires: [proposal]
apply:
  requires: [proposal, blocking-changes, tasks]
  tracks: tasks.md
  instruction: |
    BEFORE any implementation work, run:
        cospec apply "<change>" --json
    - exit 0 → gate clear. Read the returned contextFiles, work through pending
      tasks in order, marking each `- [x]` as you complete it.
    - exit 2 → BLOCKED (missing artifacts or unchecked hard blockers). STOP.
      Report each item the command lists and what it provides; suggest
      implementing and archiving those first. Do NOT proceed or work around it.
    - exit 3 → soft-blocked. List each soft blocker and what degrades without
      it, ask the user to confirm, then re-run with --allow-soft. Never skip
      silently.
    The command auto-checks entries whose blocker is already archived — trust
    its output over a manual read of blocking-changes.md. Pause on ambiguity,
    errors, or scope creep.

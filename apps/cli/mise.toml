[tasks.build]
description = "Compile cospec to a single executable at dist/cospec (local convenience)"
run = "bun build --compile src/index.ts --outfile dist/cospec"

[tasks.dev]
description = "Run cospec from source"
run = "bun run src/index.ts --"

# ───────────────────────────────────────────────
# Test
# ───────────────────────────────────────────────

# --parallel runs a worker per core, each file in a fresh global with its own preload
# run and process.env restored (bun's isolation), so the suites' files run side by side.
# --timeout 30000 gives the subprocess-heavy suites headroom over bun's 5000ms
# default: contract/integration tests each spawn the real pinned openspec binary
# (~4.6s apiece) and reliably blow past 5s when every core is busy. bun has no bunfig
# key for either flag and setDefaultTimeout in a preload does not propagate across
# files, so these tasks and the hooks' `test:changed` runner pass both. CI passes only
# --timeout (ci.yml, and `test:changed --no-parallel`): a runner's few cores leave
# parallel files contending, so it runs them one at a time and shards the contract
# suite across jobs instead. The machine-state isolation is no flag: bunfig.toml
# preloads it.
[tasks.test]
description = "Run unit tests"
run = "bun test test/unit --parallel --timeout 30000"

[tasks."test:contract"]
description = "Contract tests against the real pinned openspec binary"
run = "bun test test/contract --parallel --timeout 30000"

[tasks."test:integration"]
description = "Integration tests over the 3 repo states + lifecycles"
run = "bun test test/integration --parallel --timeout 30000"

[tasks."test:pack"]
description = "Pack smoke: bun pm pack -> tarball install -> bunx cospec"
run = "bun test test/integration/pack.test.ts --timeout 30000"

[tasks."test:pack:standalone"]
description = "Bun-less standalone smoke: build host platform package, npm-install launcher + binary with bun stripped from PATH, run cospec"
run = "bun test test/integration/pack-standalone.test.ts --timeout 180000"

[tasks."test:changed"]
description = "Run the unit/contract/integration tests a change reaches (mise run test:changed -- [--base <ref> | --staged | --push] [--no-parallel] <suite>... [-- <bun test flag>...]; the hooks' and PR CI's scope)"
run = "bun test/fixtures/run-changed.ts"

# specs artifact — delta specs. The instruction below is the shared format-rules
# block (feat's, DESIGN §3.4). A type may prepend a `specs_lead` (canon/types)
# that explains WHEN to write specs; the format rules are always appended.
# Ported at OpenSpec 1.15.0 from schemas/spec-driven/schema.yaml (specs instruction):
# write each capability file as drafted, and the 500-character description guidance.
id: specs
generates: 'specs/**/*.md'
template: spec.md
requires: [proposal]
description: Delta specs for every new or modified capability
templateBody: |
  # Spec Delta

  ## ADDED Requirements

  ### Requirement: <name>
  <!-- Normative statement using SHALL/MUST. -->

  #### Scenario: <name>
  - **WHEN** <condition>
  - **THEN** <expected outcome>
instruction: |
  One delta file per capability named in the proposal, at
  specs/<capability-path>/spec.md. `<capability-path>` is the spec directory
  relative to specs/ — one segment for a flat layout (`user-auth`), more when
  the project nests (`identity/user-auth`). Preserve the whole path: a new
  capability keeps the exact path the proposal gave it (every newly introduced
  segment kebab-case, following the project's existing organisation — do not
  add a domain level to a flat layout), and a modified capability reuses its
  existing path verbatim rather than moving or renaming it.

  Write the spec files one at a time, so the user sees progress and an
  interrupted run keeps the files it already wrote. Before writing anything,
  compare the capabilities the proposal lists with the
  specs/<capability-path>/spec.md files that already exist, and start with the
  first capability that has no file; do not rewrite an existing file unless the
  user asks. Before each file, say in one line which capability you are
  writing, and write it as soon as you have drafted it — do not plan every
  file before writing the first. Stop when every capability the proposal lists
  has its file.

  Delta operations use ## ADDED/MODIFIED/REMOVED/RENAMED Requirements headers.
  Each requirement: `### Requirement: <name>` with SHALL/MUST normative text.
  Each scenario: `#### Scenario: <name>` — EXACTLY four hashtags (`cospec
  validate` rejects three) — with WHEN/THEN bullets. MODIFIED must carry the
  full updated requirement content.

  Keep each requirement's description (the text between `### Requirement:` and
  its first scenario) to 500 characters or fewer: `cospec validate --strict`
  fails on a longer one in an ADDED requirement or the living spec. Write a new
  requirement as one behavior — move examples and edge cases into scenarios,
  and split a requirement that covers several behaviors into separate
  `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep
  the existing requirement block whole; never split, trim, or rewrite existing
  text just to meet the length. Split an existing long requirement only when
  the user asks, in a change made for that purpose: under MODIFIED keep its
  header and every scenario and cut its description to one behavior without
  changing its meaning, then add each behavior you removed as its own ADDED
  requirement with its own scenarios.

  MODIFIED/RENAMED/REMOVED may only target requirements that exist in the
  living spec at <planningHome.root>/openspec/specs/<capability-path>/spec.md —
  `cospec validate` checks this so archive cannot fail on it later.
  `planningHome.root` comes from the `cospec instructions … --json` response;
  always use it instead of a repo-relative path. It resolves to the store when
  the change lives in one (from `--store`, a project `store:` pointer, or a
  global default store) and to this repository otherwise — the field has
  already worked out which.

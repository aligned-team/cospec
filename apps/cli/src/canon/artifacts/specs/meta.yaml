# specs artifact — delta specs. The instruction below is the shared format-rules
# block (feat's, DESIGN §3.4). A type may prepend a `specs_lead` (canon/types)
# that explains WHEN to write specs; the format rules are always appended.
id: specs
generates: 'specs/**/*.md'
template: spec.md
requires: [proposal]
description: Delta specs for every new or modified capability
templateBody: |
  ## ADDED Requirements

  ### Requirement: <name>
  <!-- Normative statement using SHALL/MUST. -->

  #### Scenario: <name>
  - **WHEN** <condition>
  - **THEN** <expected outcome>
instruction: |
  One delta file per capability named in the proposal, at
  specs/<capability-path>/spec.md. `<capability-path>` is the spec directory
  relative to specs/ — one segment for a flat layout (`user-auth`), more when
  the project nests (`identity/user-auth`). Preserve the whole path: a new
  capability keeps the exact path the proposal gave it (every newly introduced
  segment kebab-case, following the project's existing organisation — do not
  add a domain level to a flat layout), and a modified capability reuses its
  existing path verbatim rather than moving or renaming it.

  Delta operations use ## ADDED/MODIFIED/REMOVED/RENAMED Requirements headers.
  Each requirement: `### Requirement: <name>` with SHALL/MUST normative text.
  Each scenario: `#### Scenario: <name>` — EXACTLY four hashtags (`cospec
  validate` rejects three) — with WHEN/THEN bullets. MODIFIED must carry the
  full updated requirement content.

  MODIFIED/RENAMED/REMOVED may only target requirements that exist in the
  living spec at <planningHome.root>/openspec/specs/<capability-path>/spec.md —
  `cospec validate` checks this so archive cannot fail on it later.
  `planningHome.root` comes from the `cospec instructions … --json` response;
  always use it instead of a repo-relative path. It resolves to the store when
  the change lives in one (from `--store`, a project `store:` pointer, or a
  global default store) and to this repository otherwise — the field has
  already worked out which.

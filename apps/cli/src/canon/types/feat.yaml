# feat — the full workflow (DESIGN §3.2/§3.4, binding schema output).
type: feat
description: A new feature — the full workflow
summary: 'proposal → blocking-changes, specs (+ design) → tasks'
schemaDescription: 'feat — a new feature. Full workflow: proposal → blocking-changes, specs (+ design) → tasks'
proposal: full
blocking: full
surfaces: true
verification: R
artifacts:
  specs: required
  design: optional
apply_requires: [proposal, blocking-changes, specs, verification, tasks]
proposalDescription: Why this feature exists, what changes, which capabilities it touches
proposalInstruction: |
  Write the proposal for a NEW FEATURE (conventional-commit type: feat).
  Sections: ## Why (motivation, at least two sentences), ## What Changes,
  ## Capabilities (### New Capabilities / ### Modified Capabilities — each
  name is a capability path relative to specs/, kebab-case per segment, and
  maps to specs/<capability-path>/spec.md; follow the project's existing
  layout and reuse an existing capability's path verbatim), ## Impact (files,
  APIs, migrations; mark breaking changes with BREAKING).
  If while writing this you realize the work is really a fix/refactor/etc.,
  stop and re-create the change: `cospec new <correct-type> <slug>`.
verificationInstruction: |
  Plan an acceptance-evidence ledger BEFORE implementing. Each `## N. <behavior>`
  is one observable behavior; mark the ones whose breakage ships a broken product
  `[critical]`. EVERY `[critical]` group must carry at least one row whose layer is
  NOT @unit — an @integration/@e2e/@manual/@runtime proof at the layer that matters
  (green unit tests are not acceptance). Rows: `- [ ] N.M @<layer> (<owner>) <probe>
  -> <result>`. Layers: @unit @integration @e2e @manual @runtime @regression
  @equivalence @benchmark @eval; owner (agent)/(human), @manual defaults to (human).
  A `[x]` row needs observed evidence after ` -> `; defer as `[~] … -> defer:
  <reason>`. Archive refuses any bare `[ ]` row.

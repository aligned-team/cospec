# docs — light workflow, documentation content only (DESIGN §3.7).
type: docs
description: Documentation content only
summary: 'proposal → blocking-changes → tasks (3 short artifacts)'
schemaDescription: 'docs — documentation content only. Light workflow: proposal → blocking-changes → tasks'
proposal: lite
blocking: lite
liteDomain: docs
surfaces: false
verification: F
artifacts:
  specs: forbidden
  design: forbidden
apply_requires: [proposal, blocking-changes, tasks]
proposalDescription: One-paragraph why + what for a documentation change
proposalInstruction: |
  This is a documentation-only change (content, no code). Keep it short:
  ## Why — one or two sentences. ## What Changes — list every doc file touched.
  ## Impact — readers or references affected.

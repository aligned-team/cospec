# Workflow identity manifest (DESIGN 6.1). Consumed by src/harness/render.ts.
# Workflow bodies are single-sourced in the sibling <id>.md files; render.ts pairs each
# workflow with each selected tool row and stamps generatedBy/contentHash frontmatter.
#
# This file declares workflow identity only. Every tool's layout — skills and commands
# roots, filename templates, body dialect, rules file, legacy dirs, detection paths — is
# declared once, in HARNESS_TABLE in src/harness/adapters.ts.
#
# `takesArguments` is audited per workflow: true when the body reads a positional
# argument (a `<type>: <text>` or a change slug). It drives the OpenCode $ARGUMENTS
# injection in src/harness/adapters.ts — OpenCode drops whatever the user typed after
# the slash command unless the command body names the placeholder.
#
# `core: true` marks the six workflows upstream's core profile installs (CORE_WORKFLOWS in
# the pinned binary, where `sync` is `sync-specs` here); test/unit/harness/core-workflows.test.ts
# compares the set to the pinned dist.

workflows:
  - id: propose
    command: propose
    skill: cospec-propose
    title: Propose
    description: >-
      Propose a new change and generate every artifact its type requires, in one guided pass.
      Also use when the user says "cospec propose" or "openspec propose".
    injectTypeTable: true
    takesArguments: true
    core: true
    ported:
      - passage: inspect-before-drafting
        file: dist/core/templates/workflows/propose.js
        pin: 1.13.1
  - id: new
    command: new
    skill: cospec-new-change
    title: New
    description: >-
      Scaffold a new change and show its typed artifact plan, then stop before authoring anything.
      Also use when the user says "cospec new" or "openspec new".
    injectTypeTable: true
    takesArguments: true
  - id: continue
    command: continue
    skill: cospec-continue-change
    title: Continue
    description: >-
      Resume a partially-built change and finish its remaining artifacts.
      Also use when the user says "cospec continue" or "openspec continue".
    takesArguments: true
  - id: ff
    command: ff
    skill: cospec-ff-change
    title: Fast-forward
    description: >-
      Author every remaining artifact on an already-scaffolded change in one pass, then validate.
      Also use when the user says "cospec ff", "cospec fast-forward", or "openspec ff".
    takesArguments: true
    ported:
      - passage: inspect-before-drafting
        file: dist/core/templates/workflows/ff-change.js
        pin: 1.13.1
  - id: update
    command: update
    skill: cospec-update-change
    title: Update
    description: >-
      Revise an existing change's already-written artifacts and keep them coherent, without
      creating new artifacts or editing code. Also use when the user says "cospec update
      change", "update the change", or "openspec update change" — never for the unrelated
      `cospec update` CLI command, which regenerates this repo's managed harness and schema
      files, not a change's artifacts.
    takesArguments: true
    core: true
  - id: apply
    command: apply
    skill: cospec-apply-change
    title: Apply
    description: >-
      Run the apply gate for a change and implement its tasks, obeying the gate's exit code.
      Also use when the user says "cospec apply" or "openspec apply".
    takesArguments: true
    core: true
    ported:
      - passage: operation-inputs-precedence
        file: dist/core/templates/workflows/apply-change.js
        pin: 1.13.1
  - id: verify
    command: verify
    skill: cospec-verify-change
    title: Verify
    description: >-
      Dress-rehearse a change before archiving — validate strictly, walk the verification ledger,
      and name the hard archive gates. Also use when the user says "cospec verify" or
      "openspec verify".
    takesArguments: true
  - id: archive
    command: archive
    skill: cospec-archive-change
    title: Archive
    description: >-
      Archive a completed change — validate, merge specs, verify, and fan blockers out.
      Also use when the user says "cospec archive" or "openspec archive".
    takesArguments: true
    core: true
    ported:
      - passage: archive-inputs-lookup
        file: dist/core/templates/workflows/archive-change.js
        pin: 1.13.1
  - id: bulk-archive
    command: bulk-archive
    skill: cospec-bulk-archive-change
    title: Bulk archive
    description: >-
      Archive a batch of completed changes in dependency order, one cospec archive call at a time.
      Also use for a plural archive request — "cospec bulk-archive", "openspec bulk-archive",
      "archive all these changes", or "archive everything".
  - id: sync-specs
    command: sync-specs
    skill: cospec-sync-specs
    title: Sync specs
    description: >-
      Merge a change's delta specs into the main specs without archiving it, exactly as archive would.
      Also use when the user says "cospec sync specs", "sync the specs", or "openspec sync".
    takesArguments: true
    core: true
  - id: explore
    command: explore
    skill: cospec-explore
    title: Explore
    description: >-
      Investigate the codebase or a spec question without writing implementation code.
      Also use when the user says "cospec explore" or "openspec explore".
    takesArguments: true
    core: true
    ported:
      - passage: ascii-diagrams
        file: dist/core/templates/workflows/explore.js
        pin: 1.13.1
  - id: onboard
    command: onboard
    skill: cospec-onboard
    title: Onboard
    description: >-
      Walk a first-time user through one real cospec change end to end, narrating each step.
      Also use when the user says "cospec onboard" or "openspec onboard".

# cospec docs site — GitHub Pages deploy.
#
# Builds apps/docs (VitePress 2.0.0-alpha.18) and publishes
# apps/docs/.vitepress/dist to GitHub Pages via Actions (not the legacy
# branch-based Pages source).
#
# Deploy trigger: release-synced, NOT push-to-main. This workflow is a
# `workflow_call` target invoked by release.yml's `deploy-docs` job (needs:
# [bump, publish]) once the CLI a given docs build describes is actually
# live — the GitHub release published and all npm packages published — so
# the site never gets ahead of what users can install. `workflow_dispatch`
# remains as a manual escape hatch (e.g. re-deploying after a Pages config
# change with no new release). There is deliberately no `push` trigger.
#
# ONE-TIME REPO SETTING (not managed by this workflow): in
# Settings -> Pages, set "Build and deployment: Source" to "GitHub Actions"
# and set the custom domain to `cospec.aligned.team`. The CNAME record for
# that domain ships inside the built artifact (apps/docs/public/CNAME is
# copied into .vitepress/dist by VitePress's public-dir passthrough), so no
# separate CNAME-write step is needed here — but the Pages custom-domain
# setting must still be configured once in the repo UI.

name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA/ref to build docs from (defaults to the triggering ref)
        type: string
        required: false
        default: ''
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # VitePress lastUpdated needs full history

      - uses: ./.github/actions/setup-mise

      # VitePress 2.0.0-alpha.18 requires Node >= 22 at build time even though
      # the task itself runs via `bun run`/mise — bun's bundled Node-API
      # compat layer is not a substitute for a real Node runtime here.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - run: bun install --frozen-lockfile

      - name: Build docs
        run: mise run docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

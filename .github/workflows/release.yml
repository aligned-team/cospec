# cospec release pipeline — the SINGLE entry point that cuts a new
# `@aligned-team/cospec` npm release and its compiled-binary GitHub release.
#
# Flow: dispatch → version → bump (commit to main via the GitHub API) → build +
# stage-npm → publish → cleanup.
#
#   1. version    — compute the next semver with cocogitto (`cog bump
#                   --dry-run`, no manifest edit, no commit), derive the tag
#                   `v<n>.<n>.<n>`, and fail fast if that tag already exists
#                   on origin.
#   2. bump       — stamp that ONE version into `apps/cli/package.json` (and
#                   the matching `bun.lock` workspace entry) with
#                   `mise run release:set-version`, then create the bump
#                   commit on main via GitHub's GraphQL `createCommitOnBranch`
#                   mutation and the tag via the REST git-tags/git-refs API,
#                   both authenticated with a short-lived installation token
#                   minted from the `cospec-release` GitHub App (variable
#                   RELEASE_APP_ID + secret RELEASE_APP_PRIVATE_KEY; Contents
#                   RW, installed on this repo only). `main`'s "Protect
#                   default branch" ruleset requires signed commits with NO
#                   exempt bypass actors; API-created commits are signed by
#                   GitHub itself (shown as "Verified", attributed to
#                   cospec-release[bot]) and pass without one. The separate
#                   "Require PRs" ruleset exempts the cospec-release app as a
#                   bypass actor — the GitHub Actions integration cannot be a
#                   bypass actor on this org (the ruleset API 422s), hence the
#                   dedicated app. The commit is idempotent: if the manifest
#                   already carries the version, only the tag is created.
#                   NOTE: unlike GITHUB_TOKEN writes, app-token commits DO
#                   trigger other workflows — the bump commit gets a normal
#                   `ci.yml` run on main (see docs/release.md).
#   3. build      — cross-compile the 7 bun targets (all on ubuntu-latest —
#                   bun's `--compile --target=<t>` cross-compiles from one
#                   host). Each leg emits TWO artifacts from the one binary: a
#                   GitHub release archive named for mise github-backend
#                   autodetection (os/arch tokens + version; tar.gz unix / zip
#                   windows; binary at the archive root) AND an
#                   `@aligned-team/cospec-<platform>` npm tarball. The
#                   linux-x64 (gnu) leg additionally runs the compiled binary
#                   and asserts `--version` matches.
#   4. stage-npm  — `mise run test:pack` (which includes the
#                   `npm publish --dry-run` tarball validation), then the
#                   bun-less standalone smoke (`mise run test:pack:standalone`):
#                   build the host platform package, npm-install launcher +
#                   platform tarballs with bun stripped from PATH, run cospec on
#                   Node only. Then `bun pm pack` the EXACT main tarball
#                   `publish` ships.
#   5. publish    — only after build + stage-npm succeed: download the release
#                   archives + the eight npm tarballs, generate SHA256SUMS over
#                   the archives (mise-verifiable), write AI-generated notes via
#                   `communique` (no GitHub side effect), create a DRAFT release
#                   with those notes + the archives + SHA256SUMS attached, flip
#                   it to published by RELEASE ID (NOT by tag — draft releases
#                   aren't addressable by tag via `gh release edit`), and ONLY
#                   THEN `npm publish` all eight packages (the seven platform
#                   packages first, the main package LAST), as the job's last
#                   step. `npm publish` is irreversible (a version can never be
#                   republished), so nothing fallible may run after it —
#                   everything reversible (the GitHub release) happens first.
#   6. cleanup    — on failure only: delete the tag via the REST API and the
#                   release, draft or already-published (both best-effort).
#                   This is always safe even if some platform packages already
#                   published: the publish loop is idempotent (`npm view` skips
#                   what is live), so a re-dispatch at the SAME version recreates
#                   the tag + release and resumes publishing only the gaps + the
#                   main package. main and the bump commit are left intact
#                   (never force-pushed).
#
# The git tag and apps/cli/package.json carry the SAME version: `set-version`
# writes the tag's semver into the manifest. cog.toml stays compute-only (no
# manifest rewrite); this workflow owns the commit and tag.
#
# See docs/release.md for the full secrets/variables list and the two-ruleset
# model that lets the app's API-created bump commit land on `main`.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = derive from conventional commits)'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto

permissions:
  contents: read

jobs:
  # ── Compute the next version (no side effects; the tag is NOT pushed here) ──
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # cog needs full history + tags to compute the bump

      # cocogitto is a pinned tool in mise.toml (like every other tool here);
      # setup-mise's `mise install` already fetched it — no ad-hoc `mise use -g`
      # (which would resolve latest upstream and make the release non-reproducible).
      - uses: ./.github/actions/setup-mise

      # cog computes the next semver from conventional commits (or the
      # dispatched override) WITHOUT side effects (--dry-run makes no manifest
      # edit / commit). The bump job then stamps it and pushes the commit + tag.
      # NOTE: with `auto`, cog prints an informational message (not a version)
      # and still exits 0 when it finds nothing to bump. The guard below
      # rejects that so the step fails clean instead of corrupting
      # $GITHUB_OUTPUT. (cog.toml bumps every known type at least a patch, so
      # in practice this is rare.)
      - name: Compute version
        id: compute
        run: |
          case "${{ inputs.bump }}" in
            auto)  VERSION=$(mise exec -- cog bump --auto  --dry-run) ;;
            major) VERSION=$(mise exec -- cog bump --major --dry-run) ;;
            minor) VERSION=$(mise exec -- cog bump --minor --dry-run) ;;
            patch) VERSION=$(mise exec -- cog bump --patch --dry-run) ;;
            *) echo "unknown bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac || { echo "cog bump --dry-run failed" >&2; exit 1; }
          VERSION="${VERSION#v}"           # cog may prefix 'v'; set-version rejects it
          # Require an exact x.y.z. `cog bump --auto` exits 0 and prints a
          # "no conventional commits ... required a bump" message (not a
          # version) when nothing is bumpable, so a mere non-empty check would
          # pass that message straight into $GITHUB_OUTPUT and fail downstream.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No release cut: bump='${{ inputs.bump }}' produced no version — cog found nothing to bump (no commits since the last tag, or only unrecognized commit types). Re-dispatch with patch, minor, or major to force a release."
            echo "cog output was: ${VERSION}" >&2
            exit 1
          fi
          TAG="v${VERSION}"

          # ── Tag-exists state machine (resume support) ──────────────────
          # A tag can already exist on origin in two very different states:
          #   1. Genuine conflict — a DIFFERENT commit was tagged ${TAG}
          #      (e.g. two dispatches raced, or history diverged). Always
          #      fail: resuming here would silently rewrite what the tag
          #      means.
          #   2. Safe resume — THIS exact dispatch already ran the `bump`
          #      job (so the tag points at the commit `cog bump` would
          #      produce again) and `publish` never got the main npm
          #      package live. This is exactly the state a prior failed
          #      dispatch leaves behind (see the `cleanup` job): the tag +
          #      bump commit survive on purpose so a re-dispatch can finish
          #      the npm publishes the first run didn't reach. Proceed —
          #      `bump` is idempotent (skips the commit if already at this
          #      version) and `publish`'s `publish_if_absent()` skips
          #      whatever is already live.
          # Query origin directly rather than relying on locally fetched
          # refs. Peeled (`^{}`) line wins when present (annotated tags,
          # which is what the `bump` job creates) — it names the commit,
          # not the tag object.
          TAG_SHA=$(
            git ls-remote --tags origin "refs/tags/${TAG}" |
              awk -v ref="refs/tags/${TAG}" '$2 == ref"^{}" { print $1; found=1 } END { if (!found) print "" }'
          )
          if [ -z "${TAG_SHA}" ]; then
            TAG_SHA=$(
              git ls-remote --tags origin "refs/tags/${TAG}" |
                awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }'
            )
          fi
          if [ -n "${TAG_SHA}" ]; then
            EXPECTED_SHA=$(git rev-parse HEAD)
            MAIN_LIVE=""
            if npm view "@aligned-team/cospec@${VERSION}" version >/dev/null 2>&1; then
              MAIN_LIVE=1
            fi
            if [ "${TAG_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "::error::tag ${TAG} already exists on origin and points at a different commit (${TAG_SHA}, expected ${EXPECTED_SHA}) — this is a genuine conflict, not a resumable release" >&2
              exit 1
            fi
            if [ -n "${MAIN_LIVE}" ]; then
              echo "::error::tag ${TAG} already exists AND @aligned-team/cospec@${VERSION} is already live on npm — nothing left to resume" >&2
              exit 1
            fi
            echo "tag ${TAG} already exists but resolves to the current commit and @aligned-team/cospec@${VERSION} is not yet live on npm — resuming a prior incomplete dispatch"
          fi
          echo "Next version: ${TAG}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

  # ── Commit the version bump to main + create the tag, both via the GitHub API
  bump:
    name: Commit version bump
    needs: version
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only checks out the repo here; every write (commit, tag)
    # rides the cospec-release app token minted below.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Plain checkout — no ssh-key. fetch-depth 0 keeps history for the
      # later tag; HEAD's sha is used as expectedHeadOid below.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise

      # Stamp the ONE computed version into apps/cli/package.json. Needs only
      # mise (usage-spec task + oxfmt) and jq — no cocogitto here.
      - name: Set cospec version
        run: mise run release:set-version -- "${{ needs.version.outputs.version }}"

      # Mint a short-lived installation token from the cospec-release GitHub
      # App. The app (not GITHUB_TOKEN) authenticates the commit + tag: it is
      # the exempt bypass actor on the "Require PRs" ruleset (the GitHub
      # Actions integration cannot be one on this org), and app-token commits
      # trigger downstream workflows (ci.yml) where GITHUB_TOKEN's would not.
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Idempotent: only create a commit if the stamp actually changed a file
      # (a re-run at the same version skips straight to the current HEAD).
      # Uses GitHub's GraphQL createCommitOnBranch mutation instead of a
      # local `git commit` + push: commits created this way are signed by
      # GitHub itself (shown as "Verified"), which satisfies main's
      # signed-commit ruleset without any bypass actor. expectedHeadOid guards
      # against a race — if main moved since checkout, the mutation fails
      # clean and a re-dispatch recovers.
      - name: Commit the version bump via the GitHub API
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          HEAD_SHA=$(git rev-parse HEAD)

          if git diff --quiet; then
            echo "apps/cli/package.json already at ${TAG#v} — skipping commit."
            echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NUL-delimited paths (safe for spaces/renames); each file's
          # contents are base64-encoded to a temp file and read back via
          # --rawfile so the blob never sits on jq's argv (avoids ARG_MAX
          # as bun.lock grows).
          ADDITIONS=$(
            git diff --name-only -z | while IFS= read -r -d '' f; do
              ENC=$(mktemp)
              base64 -w0 "$f" > "${ENC}"
              jq -n --arg path "$f" --rawfile contents "${ENC}" \
                '{path: $path, contents: $contents}'
              rm -f "${ENC}"
            done | jq -s '.'
          )

          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg headOid "${HEAD_SHA}" \
            --arg headline "chore(release): ${TAG}" \
            --argjson additions "${ADDITIONS}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  message: { headline: $headline },
                  expectedHeadOid: $headOid,
                  fileChanges: { additions: $additions }
                }
              }
            }'
          )

          RESPONSE=$(echo "${PAYLOAD}" | gh api graphql --input -)
          echo "${RESPONSE}" | jq -e '.errors' >/dev/null 2>&1 && {
            echo "::error::createCommitOnBranch failed: $(echo "${RESPONSE}" | jq -c '.errors')" >&2
            exit 1
          }

          SHA=$(echo "${RESPONSE}" | jq -r '.data.createCommitOnBranch.commit.oid')
          echo "Bump commit: ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Annotated tag object + ref, created via REST with the app token.
      # required_signatures on the ruleset does not apply to tag objects, so
      # no signing concern here.
      - name: Create the tag via the GitHub API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          SHA=${{ steps.commit.outputs.sha }}

          TAG_SHA=$(gh api --method POST "repos/${{ github.repository }}/git/tags" \
            -f tag="${TAG}" \
            -f message="${TAG}" \
            -f object="${SHA}" \
            -f type=commit \
            --jq '.sha')

          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_SHA}" >/dev/null

          echo "Tagged ${SHA} as ${TAG} (tag object ${TAG_SHA})"

  # ── Cross-compile every target → GitHub release archive + npm platform pkg ──
  # Each leg produces TWO artifacts from the one compiled binary:
  #   1. a GitHub release archive named for mise github-backend autodetection
  #      (os token linux/macos/windows + arch token x64/arm64 + a musl token on
  #      the musl variants, version in the name, tar.gz for unix / zip for
  #      windows, binary at the archive root);
  #   2. an `@aligned-team/cospec-<platform>` npm tarball (the binary dropped
  #      into the checked-in template package, packed as `npm publish` ships it).
  # bun cross-compiles all seven targets from this one ubuntu host. Linux is
  # libc-split — verified empirically (bun 1.3.14, docker): the glibc build
  # fails on Alpine, and the "musl" build is NOT static (it needs the musl
  # loader + libstdc++/libgcc, failing on Debian/Ubuntu), so one Linux binary
  # cannot cover both libcs. Hence separate gnu + musl packages with explicit
  # `libc` fields (the oxlint/swc pattern) — see apps/cli/npm/<platform>.

  build:
    name: Build ${{ matrix.asset }}
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            npm: linux-x64-gnu
            asset: linux-x64
            archive: tar.gz
          - target: bun-linux-x64-musl
            npm: linux-x64-musl
            asset: linux-x64-musl
            archive: tar.gz
          - target: bun-linux-arm64
            npm: linux-arm64-gnu
            asset: linux-arm64
            archive: tar.gz
          - target: bun-linux-arm64-musl
            npm: linux-arm64-musl
            asset: linux-arm64-musl
            archive: tar.gz
          - target: bun-darwin-x64
            npm: darwin-x64
            asset: macos-x64
            archive: tar.gz
          - target: bun-darwin-arm64
            npm: darwin-arm64
            asset: macos-arm64
            archive: tar.gz
          - target: bun-windows-x64
            npm: win32-x64
            asset: windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile

      # The bump commit already stamped every manifest — main, platform, and the
      # optionalDependencies pins — to this version via release:set-version, so
      # the checked-out platform package.json carries the right version already.
      - name: Compile
        working-directory: apps/cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          OUT=cospec
          if [[ "${TARGET}" == bun-windows-* ]]; then OUT=cospec.exe; fi
          bun build --compile --target="${TARGET}" src/index.ts --outfile "$OUT"

      # Only the linux-x64 (gnu) leg actually executes the compiled binary:
      # ubuntu-latest is glibc, and the musl build does NOT run there (it is
      # dynamically linked against the musl loader — verified empirically).
      - name: Verify --version on the native leg
        if: matrix.target == 'bun-linux-x64'
        run: |
          ACTUAL=$(./apps/cli/cospec --version)
          EXPECTED="${{ needs.version.outputs.version }}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::compiled binary reports version '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "compiled binary reports version ${ACTUAL} — OK"

      - name: Assemble the GitHub release archive
        shell: bash
        env:
          ASSET: cospec-${{ needs.version.outputs.version }}-${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          BIN=cospec
          if [[ "${ARCHIVE}" == zip ]]; then BIN=cospec.exe; fi
          STAGING="${ASSET}"
          mkdir -p "${STAGING}"
          cp "apps/cli/${BIN}" "${STAGING}/${BIN}"
          # THIRD-PARTY-LICENSES.md ships the bundled openspec's MIT/ISC notices
          # alongside the binary that embeds it (license-compliance requirement).
          cp apps/cli/README.md LICENSE apps/cli/THIRD-PARTY-LICENSES.md "${STAGING}/"
          # Binary at the archive root so mise's asset autodetection extracts it.
          if [[ "${ARCHIVE}" == zip ]]; then
            zip -j -r "${ASSET}.zip" "${STAGING}"
          else
            tar -czf "${ASSET}.tar.gz" -C "${STAGING}" .
          fi

      - name: Assemble + pack the npm platform package
        shell: bash
        env:
          NPM_DIR: ${{ matrix.npm }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          BIN=cospec
          if [[ "${ARCHIVE}" == zip ]]; then BIN=cospec.exe; fi
          PKG="apps/cli/npm/${NPM_DIR}"
          mkdir -p "${PKG}/bin"
          cp "apps/cli/${BIN}" "${PKG}/bin/${BIN}"
          # The platform package's `files` lists THIRD-PARTY-LICENSES.md; drop it
          # in next to the binary so the bundled openspec's notices ship with it.
          cp apps/cli/THIRD-PARTY-LICENSES.md "${PKG}/THIRD-PARTY-LICENSES.md"
          mkdir -p "${GITHUB_WORKSPACE}/npm-dist"
          ( cd "${PKG}" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist" )

      - name: Upload release archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: archive-${{ matrix.asset }}
          path: cospec-${{ needs.version.outputs.version }}-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload npm platform tarball
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-${{ matrix.npm }}
          path: npm-dist/*.tgz
          if-no-files-found: error

  # ── Pack + smoke-test the exact npm tarball `publish` will ship ────────────
  stage-npm:
    name: Stage npm tarball
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile

      - name: Pack smoke (existing gate)
        run: mise run test:pack

      # THE "not bun-exclusive" gate: builds the host (linux-x64-gnu) platform
      # package, npm-installs launcher + platform tarballs with bun stripped
      # from PATH, and runs `cospec --version` + a real subcommand on Node only.
      - name: Bun-less standalone pack smoke (Node-only install + run)
        run: mise run test:pack:standalone

      - name: Pack the exact main release tarball
        working-directory: apps/cli
        run: bun pm pack --destination "${{ github.workspace }}/dist-npm"

      - name: Validate the staged tarball with npm publish --dry-run
        run: |
          TARBALL=$(find dist-npm -maxdepth 1 -name '*.tgz' -print -quit)
          if [ -z "${TARBALL}" ]; then
            echo "::error::no tarball found in dist-npm for npm publish --dry-run" >&2
            exit 1
          fi
          # Already absolute (${GITHUB_WORKSPACE}-prefixed) — NOT the
          # git-shorthand bug fixed in the `publish` job's
          # `publish_if_absent()` (npm's arg classifier only misreads a
          # bare relative path with a slash, not an absolute one).
          # Verified empirically alongside that fix; left as-is.
          npm publish --dry-run "${GITHUB_WORKSPACE}/${TARBALL}"

      - name: Upload staged main tarball artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: dist-npm/*.tgz
          if-no-files-found: error

  # ── Collect artifacts, generate notes, publish atomically ──────────────────
  publish:
    name: Publish release
    needs: [version, bump, build, stage-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0 # communique reads commit history to write the notes

      # communique is a pinned tool in mise.toml (like every other tool here);
      # setup-mise's `mise install` already fetched it — no ad-hoc `mise use -g`
      # (which would resolve latest upstream and make the release non-reproducible).
      - uses: ./.github/actions/setup-mise

      # GitHub release assets: the per-platform archives (for mise + direct
      # download). SHA256SUMS covers exactly these, so mise can verify them.
      - name: Download release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: archive-*
          path: dist/
          merge-multiple: true

      # npm packages: the seven platform tarballs (npm-<platform>) plus the main
      # launcher tarball (npm-tarball). Kept out of dist/ so they are NOT
      # attached to the GitHub release — they ship to npm.
      - name: Download npm tarballs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: npm-*
          path: npm-dist/
          merge-multiple: true

      - name: List assets
        run: |
          echo "release archives:"; ls -lh dist/
          echo "npm tarballs:"; ls -lh npm-dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Generate release notes (communique)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- communique generate "${{ needs.version.outputs.tag }}" --output RELEASE_NOTES.md

      # ── Publish with NO missing-binaries window, and npm publish LAST ───────
      # The draft is created complete: notes + every asset already attached
      # (the tag is already on origin from the bump job). `npm publish` is
      # IRREVERSIBLE (a version can never be republished once live), so it is the
      # last thing this job does — everything reversible (the GitHub release
      # create + flip to published) happens first, and `cleanup` deletes it on
      # any failure here, draft or already-published, leaving a clean slate for
      # re-dispatch. The publish step itself is NOT atomic (8 per-package
      # publishes), so it is made idempotent instead: each publish is guarded by
      # `npm view`, so a mid-loop failure that leaves the first N platform
      # packages live is fully recoverable — a re-dispatch at the same version
      # skips the live packages and resumes with the rest + main.
      - name: Create draft release with notes and all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md \
            dist/cospec-*.tar.gz dist/cospec-*.zip dist/SHA256SUMS

      - name: Publish the draft (by release id — drafts aren't addressable by tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          # The releases list can lag a moment behind the create above, so
          # retry briefly. The id is selected in jq (no `head` — a SIGPIPE
          # there would trip `pipefail`); `// empty` yields nothing until a
          # match appears.
          RELEASE_ID=""
          for attempt in 1 2 3 4 5; do
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              --jq "map(select(.tag_name == \"${TAG}\" and .draft)) | .[0].id // empty")
            if [ -n "${RELEASE_ID}" ]; then break; fi
            echo "draft for ${TAG} not visible yet (attempt ${attempt}); retrying in 3s…" >&2
            sleep 3
          done
          if [ -z "${RELEASE_ID}" ]; then
            echo "no draft release found for ${TAG} after retries" >&2
            exit 1
          fi
          echo "Publishing draft release ${RELEASE_ID} (${TAG})"
          gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null

      # setup-node writes an .npmrc that wires NODE_AUTH_TOKEN to the registry
      # (a bare `npm publish` never reads NODE_AUTH_TOKEN on its own). The
      # runner's node is only used for the npm CLI; the package itself is bun.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          registry-url: 'https://registry.npmjs.org'

      # TODO(provenance): once this repo is public, add `--provenance` to EVERY
      # `npm publish` below (all eight packages). Provenance attestation requires
      # a public source repo; this repo is private today.
      # TODO(trusted-publishing): once all eight packages exist on npm
      # (@aligned-team/cospec + the seven @aligned-team/cospec-<platform>
      # packages) and trusted publishing (OIDC) is configured for EACH in npm's
      # package settings, drop NODE_AUTH_TOKEN/setup-node's .npmrc + the
      # NPM_TOKEN secret entirely and add `id-token: write` to this job's
      # permissions (npm exchanges the OIDC token automatically per package).
      #
      # This is deliberately the LAST step in the job — see the comment above
      # "Create draft release" for why nothing fallible may follow it. The seven
      # platform packages are published FIRST so the main package's
      # optionalDependencies resolve the instant it goes live; the main package
      # is published LAST.
      - name: Publish all packages to npm (platforms first, main last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          MAIN="npm-dist/aligned-team-cospec-${VERSION}.tgz"
          if [ ! -f "${MAIN}" ]; then
            echo "::error::main package tarball not found: ${MAIN}" >&2
            ls -la npm-dist >&2
            exit 1
          fi

          # Publishing 8 packages is NOT atomic — npm publish is irreversible and
          # per-package, so a mid-loop failure (transient 5xx, per-package
          # token/OIDC hiccup) can leave the first N packages live while the rest,
          # and the main package, never ship. Make each publish idempotent so a
          # re-dispatch at the SAME version cleanly resumes instead of wedging:
          # `cog bump --auto` recomputes the same X (the bump commit stays on
          # main), and re-publishing an already-live version 403s. Guard every
          # publish with `npm view <name>@<version>`: skip what is already live,
          # publish only the gaps, then main. name+version come from the tarball's
          # own package/package.json so this holds regardless of file naming.
          publish_if_absent() {
            tgz="$1"
            name=$(tar -xzOf "${tgz}" package/package.json | jq -r '.name')
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${VERSION} — already on npm (idempotent resume)"
              return 0
            fi
            echo "Publishing ${name}@${VERSION} (${tgz})"
            # `./` is load-bearing: npm's arg classifier treats a bare
            # relative path with a slash (e.g. `npm-dist/foo.tgz`) as
            # GitHub owner/repo shorthand and tries
            # `git ls-remote ssh://git@github.com/npm-dist/foo.tgz.git`
            # instead of reading the local tarball (confirmed empirically —
            # this is exactly what broke run 28853072821). A `./` or
            # absolute prefix forces the local-file interpretation.
            npm publish "./${tgz}" --access public
          }

          for tgz in npm-dist/*.tgz; do
            if [ "${tgz}" != "${MAIN}" ]; then
              publish_if_absent "${tgz}"
            fi
          done
          publish_if_absent "${MAIN}"

  # ── On failure only: roll back, but ONLY if nothing went public ────────────
  #
  # Publish-phase-aware state machine (see incident run 28853072821, which
  # this job's original unconditional delete-both logic got exactly
  # backwards — it deleted the LIVE published release while a branch
  # ruleset blocked the tag delete, leaving a public-looking void behind):
  #
  #   The `publish` job's ordering is: create draft → flip to published →
  #   npm publish (platforms, then main), each npm publish independently
  #   guarded by `npm view` for idempotent resume. That means a failure can
  #   land here in any of these observable states:
  #
  #     A. release still draft, nothing on npm            → safe to delete
  #        the tag + release; a re-dispatch starts clean.
  #     B. release published, nothing on npm yet           → the flip
  #        succeeded but every npm publish failed before the first one
  #        landed (this is exactly what happened in the incident: `publish`
  #        failed on the FIRST npm publish call). Still safe to delete —
  #        nothing external depends on this release yet.
  #     C. release published, ≥1 npm package live          → do NOT delete
  #        anything. The release is publicly visible and/or npm packages are
  #        live; tearing down the tag or release here would either dangle a
  #        live npm package with no matching GitHub release/tag, or (per
  #        the incident) delete a release users may already be looking at.
  #        The correct move is to leave it all in place — the `version`
  #        job's resume guard (above) lets a re-dispatch at the same version
  #        finish the remaining npm publishes without recreating anything.
  #
  #   So: delete iff no package for this version is live on npm. Whether the
  #   release is draft or published does not change that call — it is
  #   determined solely by npm state, since that is the irreversible half.
  cleanup:
    name: Roll back on failure
    needs: [version, bump, build, stage-npm, publish]
    if: failure()
    runs-on: ubuntu-latest
    # contents: write is for the GITHUB_TOKEN release deletion below; the tag
    # deletion rides the cospec-release app token (the tag was created by the
    # app, and ref deletion on the protected tree goes through the same
    # bypass-actor identity).
    permissions:
      contents: write
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Single source of truth for "is it safe to delete": has ANY of the
      # eight packages (main + seven platform packages, matching the
      # `build` job's matrix) for this version reached npm? `npm view` is a
      # public read, no token needed. Checked once here and passed to both
      # delete steps below so they never disagree with each other. This
      # deliberately checks every package, not just main: `publish`
      # publishes platform packages FIRST, so a mid-loop failure typically
      # leaves platform packages live while main is not — the case the
      # incident's "cleanup only reachable when npm publish has not
      # succeeded" assumption missed. A failing `npm publish` step does not
      # mean nothing published; it means the LOOP didn't finish.
      - name: Determine whether any npm package for this version is live
        id: npm-state
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PACKAGES=(
            "@aligned-team/cospec"
            "@aligned-team/cospec-linux-x64-gnu"
            "@aligned-team/cospec-linux-x64-musl"
            "@aligned-team/cospec-linux-arm64-gnu"
            "@aligned-team/cospec-linux-arm64-musl"
            "@aligned-team/cospec-darwin-x64"
            "@aligned-team/cospec-darwin-arm64"
            "@aligned-team/cospec-win32-x64"
          )
          LIVE=""
          if [ -n "${VERSION}" ]; then
            for pkg in "${PACKAGES[@]}"; do
              if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
                echo "${pkg}@${VERSION} is live on npm"
                LIVE=1
              fi
            done
          fi
          if [ -n "${LIVE}" ]; then
            echo "at least one package@${VERSION} is already live on npm — will NOT delete tag/release"
          else
            echo "no package@${VERSION} is live on npm — safe to roll back tag/release"
          fi
          echo "live=${LIVE}" >> "$GITHUB_OUTPUT"

      - name: Delete the tag via the GitHub API (best-effort)
        if: steps.npm-state.outputs.live == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          [ -n "${TAG}" ] || { echo "no tag computed; nothing to clean up"; exit 0; }
          echo "Deleting ${TAG} from origin (best-effort)"
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}" || true

      # Matches on tag_name ONLY (not `.draft`): a failure landing here can
      # find the release either still draft or already published (see the
      # state-machine comment above the `cleanup` job). Gated on the SAME
      # npm-liveness check as the tag delete above — never delete a release
      # that npm packages might already point users at.
      - name: Delete the release, if one was created (best-effort)
        if: steps.npm-state.outputs.live == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          [ -n "${TAG}" ] || exit 0
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "map(select(.tag_name == \"${TAG}\")) | .[0].id // empty" || true)
          if [ -n "${RELEASE_ID}" ]; then
            echo "Deleting release ${RELEASE_ID} (${TAG})"
            gh api --method DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}" || true
          else
            echo "no release found for ${TAG}; nothing to delete"
          fi

      - name: Leave everything in place for resume (npm already live)
        if: steps.npm-state.outputs.live != ''
        run: |
          echo "@aligned-team/cospec@${{ needs.version.outputs.version }} is already live on npm."
          echo "Leaving the tag, bump commit, and GitHub release in place."
          echo "Re-dispatch this workflow at the same version to resume — the version job's"
          echo "resume guard and publish's per-package npm-view guard pick up where this run left off."

# cospec release pipeline — the SINGLE entry point that cuts a new
# `@aligned-team/cospec` npm release and its compiled-binary GitHub release.
#
# Flow: dispatch → version → bump (commit to main via the GitHub API) → build +
# stage-npm → publish → cleanup.
#
#   1. version    — compute the next semver with cocogitto (`cog bump
#                   --dry-run`, no manifest edit, no commit), derive the tag
#                   `v<n>.<n>.<n>`, and fail fast if that tag already exists
#                   on origin.
#   2. bump       — stamp that ONE version into `apps/cli/package.json` (and
#                   the matching `bun.lock` workspace entry) with
#                   `mise run release:set-version`, then create the bump
#                   commit on main via GitHub's GraphQL `createCommitOnBranch`
#                   mutation and the tag via the REST git-tags/git-refs API,
#                   both authenticated with a short-lived installation token
#                   minted from the `cospec-release` GitHub App (variable
#                   RELEASE_APP_ID + secret RELEASE_APP_PRIVATE_KEY; Contents
#                   RW, installed on this repo only). `main`'s "Protect
#                   default branch" ruleset requires signed commits with NO
#                   exempt bypass actors; API-created commits are signed by
#                   GitHub itself (shown as "Verified", attributed to
#                   cospec-release[bot]) and pass without one. The separate
#                   "Require PRs" ruleset exempts the cospec-release app as a
#                   bypass actor — the GitHub Actions integration cannot be a
#                   bypass actor on this org (the ruleset API 422s), hence the
#                   dedicated app. The commit is idempotent: if the manifest
#                   already carries the version, only the tag is created.
#                   NOTE: unlike GITHUB_TOKEN writes, app-token commits DO
#                   trigger other workflows — the bump commit gets a normal
#                   `ci.yml` run on main (see docs/release.md).
#   3. build      — cross-compile the 5 bun targets (all on ubuntu-latest —
#                   bun's `--compile --target=<t>` cross-compiles from one
#                   host), package each as an archive, and upload as an
#                   artifact. The bun-linux-x64-musl leg additionally runs the
#                   compiled binary and asserts `--version` matches.
#   4. stage-npm  — install + `mise run test:pack`, then `bun pm pack` the
#                   EXACT tarball `publish` will ship, install that exact
#                   tarball into a fresh temp project, and smoke-test it.
#   5. publish    — only after build + stage-npm succeed: download all
#                   artifacts, generate SHA256SUMS, write AI-generated notes
#                   via `communique` (no GitHub side effect), create a DRAFT
#                   release with those notes + every asset already attached,
#                   flip it to published by RELEASE ID (NOT by tag — draft
#                   releases aren't addressable by tag via `gh release edit`),
#                   and ONLY THEN `npm publish` the staged tarball, as the
#                   job's last step. `npm publish` is irreversible (a version
#                   can never be republished), so nothing fallible may run
#                   after it — everything reversible (the GitHub release)
#                   happens first.
#   6. cleanup    — on failure only: delete the tag via the REST API and the
#                   release, draft or already-published (both best-effort).
#                   Only reachable when npm publish has NOT succeeded, so this
#                   is always safe. main and the bump commit are left intact
#                   (never force-pushed).
#
# The git tag and apps/cli/package.json carry the SAME version: `set-version`
# writes the tag's semver into the manifest. cog.toml stays compute-only (no
# manifest rewrite); this workflow owns the commit and tag.
#
# See docs/release.md for the full secrets/variables list and the two-ruleset
# model that lets the app's API-created bump commit land on `main`.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = derive from conventional commits)'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto

permissions:
  contents: read

jobs:
  # ── Compute the next version (no side effects; the tag is NOT pushed here) ──
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # cog needs full history + tags to compute the bump

      # cocogitto is a pinned tool in mise.toml (like every other tool here);
      # setup-mise's `mise install` already fetched it — no ad-hoc `mise use -g`
      # (which would resolve latest upstream and make the release non-reproducible).
      - uses: ./.github/actions/setup-mise

      # cog computes the next semver from conventional commits (or the
      # dispatched override) WITHOUT side effects (--dry-run makes no manifest
      # edit / commit). The bump job then stamps it and pushes the commit + tag.
      # NOTE: with `auto`, cog prints an informational message (not a version)
      # and still exits 0 when it finds nothing to bump. The guard below
      # rejects that so the step fails clean instead of corrupting
      # $GITHUB_OUTPUT. (cog.toml bumps every known type at least a patch, so
      # in practice this is rare.)
      - name: Compute version
        id: compute
        run: |
          case "${{ inputs.bump }}" in
            auto)  VERSION=$(mise exec -- cog bump --auto  --dry-run) ;;
            major) VERSION=$(mise exec -- cog bump --major --dry-run) ;;
            minor) VERSION=$(mise exec -- cog bump --minor --dry-run) ;;
            patch) VERSION=$(mise exec -- cog bump --patch --dry-run) ;;
            *) echo "unknown bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac || { echo "cog bump --dry-run failed" >&2; exit 1; }
          VERSION="${VERSION#v}"           # cog may prefix 'v'; set-version rejects it
          # Require an exact x.y.z. `cog bump --auto` exits 0 and prints a
          # "no conventional commits ... required a bump" message (not a
          # version) when nothing is bumpable, so a mere non-empty check would
          # pass that message straight into $GITHUB_OUTPUT and fail downstream.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No release cut: bump='${{ inputs.bump }}' produced no version — cog found nothing to bump (no commits since the last tag, or only unrecognized commit types). Re-dispatch with patch, minor, or major to force a release."
            echo "cog output was: ${VERSION}" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists on origin" >&2
            exit 1
          fi
          echo "Next version: ${TAG}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

  # ── Commit the version bump to main + create the tag, both via the GitHub API
  bump:
    name: Commit version bump
    needs: version
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only checks out the repo here; every write (commit, tag)
    # rides the cospec-release app token minted below.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Plain checkout — no ssh-key. fetch-depth 0 keeps history for the
      # later tag; HEAD's sha is used as expectedHeadOid below.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise

      # Stamp the ONE computed version into apps/cli/package.json. Needs only
      # mise (usage-spec task + oxfmt) and jq — no cocogitto here.
      - name: Set cospec version
        run: mise run release:set-version -- "${{ needs.version.outputs.version }}"

      # Mint a short-lived installation token from the cospec-release GitHub
      # App. The app (not GITHUB_TOKEN) authenticates the commit + tag: it is
      # the exempt bypass actor on the "Require PRs" ruleset (the GitHub
      # Actions integration cannot be one on this org), and app-token commits
      # trigger downstream workflows (ci.yml) where GITHUB_TOKEN's would not.
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Idempotent: only create a commit if the stamp actually changed a file
      # (a re-run at the same version skips straight to the current HEAD).
      # Uses GitHub's GraphQL createCommitOnBranch mutation instead of a
      # local `git commit` + push: commits created this way are signed by
      # GitHub itself (shown as "Verified"), which satisfies main's
      # signed-commit ruleset without any bypass actor. expectedHeadOid guards
      # against a race — if main moved since checkout, the mutation fails
      # clean and a re-dispatch recovers.
      - name: Commit the version bump via the GitHub API
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          HEAD_SHA=$(git rev-parse HEAD)

          if git diff --quiet; then
            echo "apps/cli/package.json already at ${TAG#v} — skipping commit."
            echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NUL-delimited paths (safe for spaces/renames); each file's
          # contents are base64-encoded to a temp file and read back via
          # --rawfile so the blob never sits on jq's argv (avoids ARG_MAX
          # as bun.lock grows).
          ADDITIONS=$(
            git diff --name-only -z | while IFS= read -r -d '' f; do
              ENC=$(mktemp)
              base64 -w0 "$f" > "${ENC}"
              jq -n --arg path "$f" --rawfile contents "${ENC}" \
                '{path: $path, contents: $contents}'
              rm -f "${ENC}"
            done | jq -s '.'
          )

          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg headOid "${HEAD_SHA}" \
            --arg headline "chore(release): ${TAG}" \
            --argjson additions "${ADDITIONS}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  message: { headline: $headline },
                  expectedHeadOid: $headOid,
                  fileChanges: { additions: $additions }
                }
              }
            }'
          )

          RESPONSE=$(echo "${PAYLOAD}" | gh api graphql --input -)
          echo "${RESPONSE}" | jq -e '.errors' >/dev/null 2>&1 && {
            echo "::error::createCommitOnBranch failed: $(echo "${RESPONSE}" | jq -c '.errors')" >&2
            exit 1
          }

          SHA=$(echo "${RESPONSE}" | jq -r '.data.createCommitOnBranch.commit.oid')
          echo "Bump commit: ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Annotated tag object + ref, created via REST with the app token.
      # required_signatures on the ruleset does not apply to tag objects, so
      # no signing concern here.
      - name: Create the tag via the GitHub API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          SHA=${{ steps.commit.outputs.sha }}

          TAG_SHA=$(gh api --method POST "repos/${{ github.repository }}/git/tags" \
            -f tag="${TAG}" \
            -f message="${TAG}" \
            -f object="${SHA}" \
            -f type=commit \
            --jq '.sha')

          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_SHA}" >/dev/null

          echo "Tagged ${SHA} as ${TAG} (tag object ${TAG_SHA})"

  # ── Cross-compile every bun target and upload each as an artifact ──────────
  build:
    name: Build ${{ matrix.target }}
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-musl
            archive: tar.gz
          - target: bun-linux-arm64-musl
            archive: tar.gz
          - target: bun-darwin-x64
            archive: tar.gz
          - target: bun-darwin-arm64
            archive: tar.gz
          - target: bun-windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile

      - name: Compile
        working-directory: apps/cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          OUT=cospec
          if [[ "${TARGET}" == bun-windows-* ]]; then OUT=cospec.exe; fi
          bun build --compile --target="${TARGET}" src/index.ts --outfile "$OUT"

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING=cospec-${{ matrix.target }}
          mkdir -p "${STAGING}"
          cp apps/cli/cospec "${STAGING}/cospec"
          cp apps/cli/README.md "${STAGING}/"
          cp LICENSE "${STAGING}/"
          tar -czf "${STAGING}.tar.gz" "${STAGING}"

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING=cospec-${{ matrix.target }}
          mkdir -p "${STAGING}"
          cp apps/cli/cospec.exe "${STAGING}/cospec.exe"
          cp apps/cli/README.md "${STAGING}/"
          cp LICENSE "${STAGING}/"
          zip -j -r "${STAGING}.zip" "${STAGING}"

      # Only the linux-x64-musl leg actually executes the compiled binary
      # (every leg here is cross-compiled on ubuntu-latest, so it's the only
      # native-executable target on this runner).
      - name: Verify --version on the native leg
        if: matrix.target == 'bun-linux-x64-musl'
        run: |
          ACTUAL=$(./apps/cli/cospec --version)
          EXPECTED="${{ needs.version.outputs.version }}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::compiled binary reports version '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "compiled binary reports version ${ACTUAL} — OK"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cospec-${{ matrix.target }}
          path: cospec-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  # ── Pack + smoke-test the exact npm tarball `publish` will ship ────────────
  stage-npm:
    name: Stage npm tarball
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile

      - name: Pack smoke (existing gate)
        run: mise run test:pack

      - name: Pack the exact release tarball
        working-directory: apps/cli
        run: bun pm pack --destination "${{ github.workspace }}/dist-npm"

      - name: Install the exact tarball into a fresh temp project and smoke-test it
        run: |
          TARBALL=$(find dist-npm -maxdepth 1 -name '*.tgz')
          if [ -z "${TARBALL}" ]; then
            echo "::error::no tarball produced by bun pm pack" >&2
            exit 1
          fi
          echo "Staged tarball: ${TARBALL}"

          CONSUMER=$(mktemp -d)
          printf '{\n  "name": "cospec-release-smoke",\n  "version": "1.0.0",\n  "private": true\n}\n' \
            > "${CONSUMER}/package.json"
          (cd "${CONSUMER}" && bun add "${GITHUB_WORKSPACE}/${TARBALL}")

          BIN="${CONSUMER}/node_modules/.bin/cospec"
          ACTUAL=$("${BIN}" --version)
          EXPECTED="${{ needs.version.outputs.version }}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::installed tarball reports version '${ACTUAL}', expected '${EXPECTED}'" >&2
            exit 1
          fi
          echo "installed tarball reports version ${ACTUAL} — OK"

          "${BIN}" instructions --help >/dev/null
          echo "installed tarball runs 'cospec instructions --help' — OK"

      - name: Upload staged tarball artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: dist-npm/*.tgz
          if-no-files-found: error

  # ── Collect artifacts, generate notes, publish atomically ──────────────────
  publish:
    name: Publish release
    needs: [version, bump, build, stage-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0 # communique reads commit history to write the notes

      # communique is a pinned tool in mise.toml (like every other tool here);
      # setup-mise's `mise install` already fetched it — no ad-hoc `mise use -g`
      # (which would resolve latest upstream and make the release non-reproducible).
      - uses: ./.github/actions/setup-mise

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist/

      - name: Flatten dist/ (remove per-artifact sub-dirs)
        run: |
          find dist/ -mindepth 2 -type f -exec mv {} dist/ \;
          find dist/ -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} \;
          ls -lh dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Generate release notes (communique)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- communique generate "${{ needs.version.outputs.tag }}" --output RELEASE_NOTES.md

      # ── Publish with NO missing-binaries window, and npm publish LAST ───────
      # The draft is created complete: notes + every asset already attached
      # (the tag is already on origin from the bump job). `npm publish` is
      # IRREVERSIBLE (a version can never be republished once live), so it must
      # be the last thing this job does — nothing fallible may run after it, or
      # a failure there trips `cleanup` into deleting the tag/release out from
      # under an already-live npm version, permanently wedging that version
      # (re-dispatch recomputes the same version, then `npm publish` 403s
      # forever). The GitHub release side (create + flip to published) is fully
      # reversible up to that point — `cleanup` deletes it on any failure here,
      # draft or already-published, so an early failure always leaves a clean
      # slate for re-dispatch.
      - name: Create draft release with notes and all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md \
            dist/cospec-*.tar.gz dist/cospec-*.zip dist/*.tgz dist/SHA256SUMS

      - name: Publish the draft (by release id — drafts aren't addressable by tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          # The releases list can lag a moment behind the create above, so
          # retry briefly. The id is selected in jq (no `head` — a SIGPIPE
          # there would trip `pipefail`); `// empty` yields nothing until a
          # match appears.
          RELEASE_ID=""
          for attempt in 1 2 3 4 5; do
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              --jq "map(select(.tag_name == \"${TAG}\" and .draft)) | .[0].id // empty")
            if [ -n "${RELEASE_ID}" ]; then break; fi
            echo "draft for ${TAG} not visible yet (attempt ${attempt}); retrying in 3s…" >&2
            sleep 3
          done
          if [ -z "${RELEASE_ID}" ]; then
            echo "no draft release found for ${TAG} after retries" >&2
            exit 1
          fi
          echo "Publishing draft release ${RELEASE_ID} (${TAG})"
          gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null

      # setup-node writes an .npmrc that wires NODE_AUTH_TOKEN to the registry
      # (a bare `npm publish` never reads NODE_AUTH_TOKEN on its own). The
      # runner's node is only used for the npm CLI; the package itself is bun.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          registry-url: 'https://registry.npmjs.org'

      # TODO(provenance): once this repo is public, add `--provenance` here.
      # Provenance attestation requires a public source repo; this repo is
      # private today.
      # TODO(trusted-publishing): once @aligned-team/cospec exists on npm and
      # trusted publishing (OIDC) is configured for it in npm's package
      # settings, drop NODE_AUTH_TOKEN/setup-node's .npmrc + the NPM_TOKEN
      # secret entirely and add `id-token: write` to this job's permissions
      # (npm exchanges the OIDC token automatically).
      #
      # This is deliberately the LAST step in the job — see the comment above
      # "Create draft release" for why nothing fallible may follow it.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz')
          npm publish "${TARBALL}" --access public

  # ── On failure only: roll the pushed tag + draft release back ──────────────
  cleanup:
    name: Roll back on failure
    needs: [version, bump, build, stage-npm, publish]
    if: failure()
    runs-on: ubuntu-latest
    # contents: write is for the GITHUB_TOKEN release deletion below; the tag
    # deletion rides the cospec-release app token (the tag was created by the
    # app, and ref deletion on the protected tree goes through the same
    # bypass-actor identity).
    permissions:
      contents: write
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Delete the tag via the GitHub API (best-effort)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          [ -n "${TAG}" ] || { echo "no tag computed; nothing to clean up"; exit 0; }
          echo "Deleting ${TAG} from origin (best-effort)"
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}" || true

      # Matches on tag_name ONLY (not `.draft`): `publish` now flips the draft
      # to published BEFORE `npm publish` runs (npm publish is the job's last,
      # irreversible step — see the comment on "Create draft release" in the
      # publish job), so a failure that lands us here can find the release
      # either still draft (the flip itself failed) or already published (the
      # flip succeeded but a later step failed). Either way `cleanup` only ever
      # runs when npm publish has NOT succeeded, so deleting the release here
      # is always safe.
      - name: Delete the release, if one was created (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.version.outputs.tag }}
          [ -n "${TAG}" ] || exit 0
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "map(select(.tag_name == \"${TAG}\")) | .[0].id // empty" || true)
          if [ -n "${RELEASE_ID}" ]; then
            echo "Deleting release ${RELEASE_ID} (${TAG})"
            gh api --method DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}" || true
          else
            echo "no release found for ${TAG}; nothing to delete"
          fi

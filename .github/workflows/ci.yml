name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.filter.outputs.bun || steps.all.outputs.all }}
      canon: ${{ steps.filter.outputs.canon || steps.all.outputs.all }}
      openspec_changes: ${{ steps.filter.outputs.openspec_changes || steps.all.outputs.all }}
      openspec_specs: ${{ steps.filter.outputs.openspec_specs || steps.all.outputs.all }}
      openspec_schemas: ${{ steps.filter.outputs.openspec_schemas || steps.all.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.all.outputs.all }}
      actions: ${{ steps.filter.outputs.actions || steps.all.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.all.outputs.all }}
      install: ${{ steps.filter.outputs.install || steps.all.outputs.all }}
      nix: ${{ steps.filter.outputs.nix || steps.all.outputs.all }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: all
        if: github.event_name == 'merge_group'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            bun:
              - 'apps/**/*.{ts,tsx,js,jsx,mjs,cjs}'
              - 'package.json'
              - 'bun.lock'
              - 'mise.toml'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            canon:
              - 'apps/cli/src/canon/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            openspec_changes: ['openspec/changes/**', 'mise.toml', '.github/workflows/ci.yml']
            openspec_specs: ['openspec/specs/**', 'mise.toml', '.github/workflows/ci.yml']
            openspec_schemas: ['openspec/schemas/**', 'mise.toml', '.github/workflows/ci.yml']
            shell: ['scripts/**', '.github/workflows/ci.yml', '.github/actions/**']
            actions: ['.github/workflows/**', '.github/actions/**']
            install: ['scripts/install/**', '.github/workflows/ci.yml']
            nix: ['flake.nix', 'flake.lock', 'nix/**', '.github/workflows/ci.yml']
            docs:
              - 'apps/docs/**'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'package.json'
              - 'bun.lock'
              - '.github/actions/setup-mise/**'

  ci-bun:
    needs: detect-changes
    if: needs.detect-changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - name: mise lockfile drift gate
        run: |
          mise install
          git diff --exit-code mise.lock
      - run: bun install --frozen-lockfile
      # Neither fish nor zsh has a mise/aqua registry entry (checked:
      # `mise registry | grep -iE 'fish|zsh'` — nothing), so both are
      # installed via apt rather than mise-managed like every other tool
      # here. zsh turned out to be absent from the ubuntu-latest image too
      # (the "required completion shells present" step below caught it the
      # first time this gate ran). ubuntu-latest's apt repos don't carry
      # historical package versions, so `apt-get install -y` (unpinned) is
      # the only reproducible option; the "required completion shells
      # present" step right after this one is what actually keeps CI honest
      # if either install ever silently stops providing its binary.
      - name: Install fish and zsh (no mise/aqua registry entry)
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Required completion shells present
        run: |
          missing=()
          for shell in bash zsh fish; do
            command -v "$shell" >/dev/null 2>&1 || missing+=("$shell")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "missing required shell(s): ${missing[*]}" >&2
            exit 1
          fi
      - run: mise run lint
      - run: mise run format:check
      - run: mise run typecheck
      - name: Unit tests (coverage gate)
        run: bun test apps/cli/test/unit --coverage --timeout 30000
      - run: mise run test:contract
      - run: mise run test:integration
      - name: Vendored openspec bundle drift gate
        run: mise run vendor:openspec:check
      - name: Pack smoke
        run: mise run test:pack

  ci-openspec:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.canon == 'true' ||
      needs.detect-changes.outputs.openspec_changes == 'true' ||
      needs.detect-changes.outputs.openspec_specs == 'true' ||
      needs.detect-changes.outputs.openspec_schemas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile
      - name: Validate changes and specs (strict)
        run: mise run cospec-validate-all
      - name: Canon drift gate
        run: mise run generate:check
      - name: Validate composed schemas (raw openspec)
        run: mise run openspec:schema:validate
      - name: Agent-context sync gate
        run: mise run agents:check

  ci-shell:
    needs: detect-changes
    if: needs.detect-changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - name: ShellCheck hook + task scripts
        run: mise exec -- shellcheck -x scripts/hooks/check-commit-msg scripts/hooks/pre-push-gate scripts/mise-tasks/agents/sync scripts/mise-tasks/vendor/openspec scripts/mise-tasks/release/flake-pin scripts/install/install.sh scripts/install/test/install-sh.test.sh

  ci-actions-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - run: mise exec -- actionlint

  ci-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # VitePress lastUpdated needs full history
      - uses: ./.github/actions/setup-mise
      # VitePress 2.0.0-alpha.18 requires Node >= 22 at build time — see
      # release.yml's build-docs job for the same requirement on the deploy
      # path.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build docs
        run: mise run docs:build

  # Advisory: times `cospec __complete changes` against its recorded budget and
  # writes the result to the step summary. Never gates — not in ci-gate's needs,
  # and the script always exits 0 (shared-runner wall-clock is too noisy).
  ci-bench-complete:
    needs: detect-changes
    if: needs.detect-changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile
      - name: __complete startup timing (advisory)
        run: mise run bench:complete

  # install.sh end-to-end against a fake on-disk release, once per libc: the
  # same test file asserts glibc selection on ubuntu and musl selection on
  # Alpine (real host detection, no overrides).
  ci-install-sh:
    needs: detect-changes
    if: needs.detect-changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install.sh on Ubuntu (glibc)
        run: EXPECT_ASSET=linux-x64 sh scripts/install/test/install-sh.test.sh
      # Alpine 3.22, pinned by its multi-arch index digest.
      - name: install.sh on Alpine (musl)
        run: |
          docker run --rm -v "${PWD}:/work:ro" -e EXPECT_ASSET=linux-x64-musl \
            alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
            sh -c 'apk add --no-cache curl >/dev/null && sh /work/scripts/install/test/install-sh.test.sh'

  ci-install-ps1:
    needs: detect-changes
    if: needs.detect-changes.outputs.install == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Pester tests for install.ps1
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path scripts/install/test/install-ps1.Tests.ps1 -CI

  # Builds the flake's package (fetching the pinned release archive by hash),
  # runs it, and builds a consumer flake that only uses overlays.default.
  ci-nix:
    needs: detect-changes
    if: needs.detect-changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: nix flake check
        run: nix flake check
      - name: nix run . -- --version
        run: |
          ACTUAL=$(nix run . -- --version)
          EXPECTED=$(jq -r .version nix/release.json)
          [ "${ACTUAL}" = "${EXPECTED}" ] || { echo "::error::flake cospec reports ${ACTUAL}, expected ${EXPECTED}"; exit 1; }
      - name: Consumer flake applying overlays.default
        run: nix build ./nix/test/consumer --override-input cospec "git+file://${PWD}?shallow=1" --no-write-lock-file -L

  ci-gate:
    if: always()
    needs:
      [
        detect-changes,
        ci-bun,
        ci-openspec,
        ci-shell,
        ci-actions-lint,
        ci-docs,
        ci-install-sh,
        ci-install-ps1,
        ci-nix,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BUN: ${{ needs.ci-bun.result }}
          OPENSPEC: ${{ needs.ci-openspec.result }}
          SHELL_JOB: ${{ needs.ci-shell.result }}
          ACTIONS: ${{ needs.ci-actions-lint.result }}
          DOCS: ${{ needs.ci-docs.result }}
          INSTALL_SH: ${{ needs.ci-install-sh.result }}
          INSTALL_PS1: ${{ needs.ci-install-ps1.result }}
          NIX: ${{ needs.ci-nix.result }}
        run: |
          if [[ "$DETECT" != "success" ]]; then
            echo "detect-changes did not succeed: $DETECT — gate fails"; exit 1
          fi
          for r in "$BUN" "$OPENSPEC" "$SHELL_JOB" "$ACTIONS" "$DOCS" "$INSTALL_SH" "$INSTALL_PS1" "$NIX"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job result '$r' — gate fails"; exit 1
            fi
          done
          echo "All jobs passed or skipped — gate passes"

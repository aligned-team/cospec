name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      canon: ${{ steps.filter.outputs.canon || steps.all.outputs.all }}
      openspec_changes: ${{ steps.filter.outputs.openspec_changes || steps.all.outputs.all }}
      openspec_specs: ${{ steps.filter.outputs.openspec_specs || steps.all.outputs.all }}
      openspec_schemas: ${{ steps.filter.outputs.openspec_schemas || steps.all.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.all.outputs.all }}
      actions: ${{ steps.filter.outputs.actions || steps.all.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.all.outputs.all }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Pushes to main and the merge queue run every job, and every test suite whole (release.yml
      # bumps only a main commit whose run passed); only a pull request is scoped to what it changes.
      - id: all
        if: github.event_name != 'pull_request'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # `mise.lock` sits beside every `mise.toml`: each job installs its
          # tools from the lockfile (`mise install --locked`).
          filters: |
            canon:
              - 'apps/cli/src/canon/**'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
            openspec_changes: ['openspec/changes/**', 'mise.toml', 'mise.lock', '.github/workflows/ci.yml']
            openspec_specs: ['openspec/specs/**', 'mise.toml', 'mise.lock', '.github/workflows/ci.yml']
            openspec_schemas: ['openspec/schemas/**', 'mise.toml', 'mise.lock', '.github/workflows/ci.yml']
            shell: ['scripts/**', '.github/workflows/ci.yml', '.github/actions/**']
            actions: ['.github/workflows/**', '.github/actions/**']
            docs:
              - 'apps/docs/**'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'mise.lock'
              - 'package.json'
              - 'bun.lock'
              - '.github/actions/setup-mise/**'

  # Runs on every pull request: `bun fmt` checks every change's openspec Markdown, the unit tests
  # read the docs trees, and the integration tests are scoped below (the contract tests run in
  # ci-contract).
  ci-bun:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # a pull request's test selection diffs against its base commit
      - uses: ./.github/actions/setup-mise
      # mise.lock must be exactly what the min_version mise release writes, for
      # every platform — the release setup-mise pins.
      - name: mise lockfile drift gate
        run: mise run lock:check
      - run: bun install --frozen-lockfile
      # Neither fish nor zsh has a mise/aqua registry entry (checked:
      # `mise registry | grep -iE 'fish|zsh'` — nothing), so both are
      # installed via apt rather than mise-managed like every other tool
      # here. zsh turned out to be absent from the ubuntu-latest image too
      # (the "required completion shells present" step below caught it the
      # first time this gate ran). ubuntu-latest's apt repos don't carry
      # historical package versions, so `apt-get install -y` (unpinned) is
      # the only reproducible option; the "required completion shells
      # present" step right after this one is what actually keeps CI honest
      # if either install ever silently stops providing its binary.
      - name: Install fish and zsh (no mise/aqua registry entry)
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Required completion shells present
        run: |
          missing=()
          for shell in bash zsh fish; do
            command -v "$shell" >/dev/null 2>&1 || missing+=("$shell")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "missing required shell(s): ${missing[*]}" >&2
            exit 1
          fi
      - run: mise run lint
      - run: mise run format:check
      - run: mise run typecheck
      # CI runs every suite's files one at a time, never `--parallel`: each test spawns the pinned
      # binary, so a runner's few cores leave parallel files contending, not faster.
      # The coverage gate measures the whole unit suite, so every event runs all of it.
      - name: Unit tests (coverage gate)
        run: bun test apps/cli/test/unit --coverage --timeout 30000
      # A pull request runs the integration tests its changes (its diff from its base) reach — the
      # test files whose import graph reaches a changed file, or the whole suite when a change sits
      # outside the graph (`mise run test:changed`, apps/cli/test/fixtures/test-scope.ts).
      - name: Integration tests (what the pull request reaches)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run test:changed -- --base "$BASE" --no-parallel integration
      - name: Integration tests
        if: github.event_name != 'pull_request'
        working-directory: apps/cli
        run: bun test ./test/integration --timeout 30000
      - name: Bench unit tests
        run: mise run test:bench
      - name: Release script test
        run: mise run test:release
      - name: Vendored openspec bundle drift gate
        run: mise run vendor:openspec:check
      - name: Pack smoke
        run: mise run test:pack

  # The contract suite, split across four runners: on one runner, `--parallel` workers only contend
  # for its cores. bun cuts the slices (`--shard`) by the per-file durations main's last run
  # recorded (`--timings`), or by file count when none are recorded yet; each runner runs its slice
  # one file at a time. A pull request slices what it reaches, as ci-bun selects integration.
  ci-contract-timings:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.lookup.outputs.cache-matched-key }}
    steps:
      # The slices add up to the suite only when every shard reads the same durations, so this one
      # lookup names the entry they all restore: a save landing mid-run cannot reach some shards
      # and not others.
      - id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli/.bun-test-timings
          key: contract-timings-${{ github.run_id }}
          restore-keys: contract-timings-
          lookup-only: true

  ci-contract:
    needs: ci-contract-timings
    name: ci-contract (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # a pull request's test selection diffs against its base commit
      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile
      # upstream-spellings.test.ts runs `completion zsh` and `completion fish` (see ci-bun).
      - name: Install fish and zsh (no mise/aqua registry entry)
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Restore the recorded durations
        if: needs.ci-contract-timings.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli/.bun-test-timings
          key: ${{ needs.ci-contract-timings.outputs.key }}
          fail-on-cache-miss: true
      - name: Contract tests, shard ${{ matrix.shard }} of 4
        working-directory: apps/cli
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          RECORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          shopt -s nullglob
          flags=("--shard=$SHARD/4")
          # --update-timings writes the first --timings path, with only the files this shard ran.
          if [[ "$RECORD" == true ]]; then
            flags+=(--update-timings "--timings=.bun-test-timings/next/$SHARD.json")
          fi
          for recorded in .bun-test-timings/*.json; do
            flags+=("--timings=$recorded")
          done
          if [[ "$EVENT" == pull_request ]]; then
            bun test/fixtures/run-changed.ts --base "$BASE" --no-parallel contract -- "${flags[@]}"
          else
            bun test ./test/contract --timeout 30000 "${flags[@]}"
          fi
      - name: Keep this shard's durations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: contract-timings-${{ matrix.shard }}
          path: apps/cli/.bun-test-timings/next/${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  # Only main's run records the durations later runs slice by: a pull request's run times only what
  # it reaches, and its own cache entry would shadow main's for its later runs.
  ci-contract-timings-save:
    needs: ci-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: contract-timings-*
          path: apps/cli/.bun-test-timings
          merge-multiple: true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli/.bun-test-timings
          key: contract-timings-${{ github.run_id }}-${{ github.run_attempt }}

  ci-openspec:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.canon == 'true' ||
      needs.detect-changes.outputs.openspec_changes == 'true' ||
      needs.detect-changes.outputs.openspec_specs == 'true' ||
      needs.detect-changes.outputs.openspec_schemas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - run: bun install --frozen-lockfile
      - name: Validate changes and specs (strict)
        run: mise run cospec-validate-all
      - name: Canon drift gate
        run: mise run generate:check
      - name: Validate composed schemas (raw openspec)
        run: mise run openspec:schema:validate
      - name: Agent-context sync gate
        run: mise run agents:check

  ci-shell:
    needs: detect-changes
    if: needs.detect-changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - name: ShellCheck hook + task scripts
        run: mise exec -- shellcheck -x scripts/hooks/check-commit-msg scripts/mise-tasks/agents/sync scripts/mise-tasks/vendor/openspec scripts/mise-tasks/lock

  ci-actions-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mise
      - run: mise exec -- actionlint

  ci-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # VitePress lastUpdated needs full history
      - uses: ./.github/actions/setup-mise
      # VitePress 2.0.0-alpha.18 requires Node >= 22 at build time — see
      # release.yml's build-docs job for the same requirement on the deploy
      # path.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build docs
        run: mise run docs:build

  ci-gate:
    if: always()
    needs: [detect-changes, ci-bun, ci-contract, ci-openspec, ci-shell, ci-actions-lint, ci-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BUN: ${{ needs.ci-bun.result }}
          CONTRACT: ${{ needs.ci-contract.result }}
          OPENSPEC: ${{ needs.ci-openspec.result }}
          SHELL_JOB: ${{ needs.ci-shell.result }}
          ACTIONS: ${{ needs.ci-actions-lint.result }}
          DOCS: ${{ needs.ci-docs.result }}
        run: |
          if [[ "$DETECT" != "success" ]]; then
            echo "detect-changes did not succeed: $DETECT — gate fails"; exit 1
          fi
          # ci-contract always runs; skipped means its timings lookup failed, so nothing ran.
          if [[ "$CONTRACT" != "success" ]]; then
            echo "ci-contract did not succeed: $CONTRACT — gate fails"; exit 1
          fi
          for r in "$BUN" "$OPENSPEC" "$SHELL_JOB" "$ACTIONS" "$DOCS"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job result '$r' — gate fails"; exit 1
            fi
          done
          echo "All jobs passed or skipped — gate passes"

name: Setup mise
description: Install mise and all tools from mise.toml with caching

inputs:
  install_args:
    description: Arguments passed to `mise install` (e.g. "bun" to install only bun)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # mise itself runs at mise.toml's `min_version`, the release mise.lock is
    # written with (`mise run lock`), so a new mise release never changes what
    # CI installs or what the lockfile drift gate expects.
    - name: Read mise.toml's min_version
      id: mise-version
      shell: bash
      run: |
        version="$(sed -nE 's/^min_version = "([^"]+)"$/\1/p' mise.toml)"
        if [[ -z "${version}" ]]; then
          echo "mise.toml sets no min_version for CI to pin mise to" >&2
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: ${{ steps.mise-version.outputs.version }}
        experimental: 'true'
        cache: true
        cache_key_prefix: mise-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install mise tools
      if: inputs.install_args != ''
      shell: bash
      run: mise install ${{ inputs.install_args }}

    # Cache bun's tarball cache so subsequent `bun install --frozen-lockfile`
    # calls skip the network and just extract. Keyed on bun.lock so cache
    # misses only happen when the lockfile actually changes.
    - name: Cache bun tarball cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-install-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-cache-v1-${{ runner.os }}-${{ runner.arch }}-

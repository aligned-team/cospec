min_version = "2026.4.1"
experimental_monorepo_root = true

[settings]
experimental = true
jobs = 8
lockfile = true
npm.package_manager = "bun"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"
_.file = [{ path = ".env.local", redact = true }]

[tools]
bun = "1.3.14"
# The OpenSpec CLI cospec wraps. This mise entry is a dev/probe convenience; the
# runtime copy is the pinned `@fission-ai/openspec` package dependency of
# apps/cli, resolved by path (never $PATH) — see docs/architecture.md.
"npm:@fission-ai/openspec" = "1.5.0"
"npm:@typescript/native-preview" = "7.0.0-dev.20260624.1"
"npm:oxlint" = "1.71.0"
"npm:oxfmt" = "0.56.0"
# Git hooks runner. >= 1.44.2 is required for the pklr cache-freshness fix
# (jdx/hk#879) so edits to hk.pkl are picked up without a manual `hk cache clear`.
"aqua:jdx/hk" = "1.48.0"
"aqua:jdx/usage" = "3.2.1"
# TOML formatter (used by the hk taplo step) — prebuilt binary via aqua. The
# cargo backend builds from source on every cache miss, which is slow and flakes
# on transient crates.io download failures. Same upstream, same `taplo` binary.
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:koalaman/shellcheck" = "0.10.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:cli/cli" = "2.91.0"
# Release-only tools (used by .github/workflows/release.yml's version + publish
# jobs). Pinned like every other tool here — see docs/release.md — so a
# dispatch is reproducible instead of resolving whatever upstream shipped that
# day. Prebuilt binaries, no source compile.
"aqua:cocogitto/cocogitto" = "7.0.0"
"github:jdx/communique" = "1.2.0"

[monorepo]
config_roots = ["apps/*"]

# Scripts in scripts/mise-tasks/ are invoked directly by toml tasks
# (run = "bash scripts/mise-tasks/..."). An empty includes list stops mise from
# auto-discovering them as duplicate tasks, so toml description fields stay
# authoritative in `mise tasks ls`.
[task_config]
includes = []

[hooks]
postinstall = "hk install --mise"

# ───────────────────────────────────────────────
# cospec entrypoint
# ───────────────────────────────────────────────

[tasks.cospec]
description = "Run cospec from source (mise run cospec -- <args>)"
run = "bun run apps/cli/src/index.ts --"

# ───────────────────────────────────────────────
# Build
# ───────────────────────────────────────────────

[tasks.build]
description = "Build the cospec single-file executable (local convenience)"
run = "mise run //apps/cli:build"

# ───────────────────────────────────────────────
# Lint / format
# ───────────────────────────────────────────────

[tasks.lint]
description = "Lint all TypeScript/JavaScript with oxlint"
run = "oxlint ."

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "oxlint --fix ."

[tasks."format:check"]
description = "Check formatting — exits non-zero if any file differs"
run = "oxfmt --check ."

[tasks."format:fix"]
description = "Format all files in place"
run = "oxfmt ."

[tasks.typecheck]
description = "Type-check all workspaces (apps/*) and the e2e eval sources with tsgo"
run = ["bun run --filter '*' typecheck", "tsgo --noEmit -p e2e/tsconfig.json"]

# ───────────────────────────────────────────────
# Test
# ───────────────────────────────────────────────

# --timeout 30000 gives the subprocess-heavy suites headroom over bun's 5000ms
# default: contract/integration tests each spawn the real pinned openspec binary
# (~4.6s apiece) and reliably blow past 5s when `mise run check` runs the suites
# concurrently. bun has no bunfig timeout key and setDefaultTimeout in a preload
# does not propagate across files in a directory run, so the flag is set on every
# `bun test` invocation (these tasks, which hk hooks and CI drive; plus the direct
# unit run in ci.yml).
[tasks.test]
description = "Run unit tests"
run = "bun test apps/cli/test/unit --timeout 30000"

[tasks."test:contract"]
description = "Contract tests against the real pinned openspec binary"
run = "bun test apps/cli/test/contract --timeout 30000"

[tasks."test:integration"]
description = "Integration tests over the 3 repo states + lifecycles"
run = "bun test apps/cli/test/integration --timeout 30000"

[tasks."test:pack"]
description = "Pack smoke: bun pm pack -> tarball install -> bunx cospec"
run = "bun test apps/cli/test/integration/pack.test.ts --timeout 30000"

[tasks."test:release"]
description = "Test the release:set-version script against a throwaway --root (no working-tree mutation)"
run = "bun test e2e/release --timeout 30000"

# ───────────────────────────────────────────────
# Generate (canon -> managed files) + drift gate
# ───────────────────────────────────────────────

[tasks.generate]
description = "Regenerate managed files from canon (self-repo)"
run = "mise run cospec -- update"

[tasks."generate:check"]
description = "Fail if any managed file drifts from canon (CI/pre-commit gate)"
run = "mise run cospec -- update --check"

[tasks."openspec:schema:validate"]
description = "Structurally validate each composed schema with the raw openspec CLI"
run = """
set -eu
for t in build chore ci docs feat fix perf refactor revert style test; do
  echo "openspec schema validate $t"
  openspec schema validate "$t"
done
"""

[tasks."cospec-validate-all"]
description = "Strictly validate every change and spec in this repo"
run = "mise run cospec -- validate --all --strict"

# ───────────────────────────────────────────────
# Agent context sync
# ───────────────────────────────────────────────

[tasks."agents:sync"]
description = "Rewrite the shared block in CLAUDE.md/AGENTS.md from .agents/shared.md"
run = "bash scripts/mise-tasks/agents/sync"

[tasks."agents:check"]
description = "Fail if CLAUDE.md/AGENTS.md drift from .agents/shared.md"
run = "bash scripts/mise-tasks/agents/sync --check"

# ───────────────────────────────────────────────
# Commit / PR title linting
# ───────────────────────────────────────────────

[tasks."commit:check-title"]
description = "Lint a PR/commit title (PR_TITLE env) against commitlint"
run = 'printf "%s\n" "$PR_TITLE" | bunx commitlint'

# ───────────────────────────────────────────────
# E2E eval (optional; exit-0 skip without DEEPSEEK_API_KEY)
# ───────────────────────────────────────────────

[tasks."eval:e2e"]
description = "DeepSeek E2E eval of the shipped skills (advisory, never gates CI)"
run = "bun run e2e/eval/run.ts"

# ───────────────────────────────────────────────
# Release
# ───────────────────────────────────────────────

[tasks."release:set-version"]
description = "Stamp ONE release version (semver) into apps/cli/package.json and its bun.lock workspace entry. Idempotent. Usage: mise run release:set-version -- 1.2.3"
run = "bash scripts/mise-tasks/release/set-version"

# ───────────────────────────────────────────────
# Composed CI gate
# ───────────────────────────────────────────────

[tasks.check]
description = "Full CI gate: lint + format + typecheck + tests + drift + openspec validation"
depends = [
  "lint",
  "format:check",
  "typecheck",
  "test",
  "test:contract",
  "test:integration",
  "test:release",
  "generate:check",
  "agents:check",
  "cospec-validate-all",
  "openspec:schema:validate",
]

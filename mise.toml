experimental_monorepo_root = true

[monorepo]
config_roots = [
  "apps/*",
]

[settings]
experimental = true
lockfile = true

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pkl"

[tools]
hk = "1"
pkl = "0.31"
"npm:@fission-ai/openspec" = "1"
"npm:@commitlint/cli" = "20"
"npm:@commitlint/config-conventional" = "20"
bun = "1"
oxlint = "1"
oxfmt = "0.51"

[hooks]
postinstall = "hk install --mise"

[tasks."commitlint:edit"]
description = "Validate one commit message file with commitlint"
usage = '''
arg "<commit_msg_file>" help="Path to the commit message file"
'''
run = """
set -euo pipefail

commitlint_config_dir="$(mise where npm:@commitlint/config-conventional)/lib/node_modules"
export NODE_PATH="${commitlint_config_dir}${NODE_PATH:+:${NODE_PATH}}"
commitlint --edit "${usage_commit_msg_file}"
"""

[tasks."openspec:validate-all"]
description = "Strictly validate all OpenSpec changes and specs"
run = "openspec validate --all --strict"

[tasks."openspec:validate-changed"]
description = "Strictly validate OpenSpec changes/specs touched by staged files in parallel"
run = """
set -euo pipefail

concurrency="${OPENSPEC_CONCURRENCY:-6}"

items="$(
  git diff --cached --name-only --diff-filter=ACMR -- \
    'openspec/changes/*' 'openspec/specs/*' \
  | awk -F'/' '
      $2 == "changes" && $3 != "" && $3 != "archive" { print "change " $3 }
      $2 == "specs" && $3 != "" { print "spec " $3 }
    ' \
  | sort -u
)"

if [ -z "$items" ]; then
  echo "openspec: no staged changes or specs; skipping validation."
  exit 0
fi

printf '%s\n' "$items" | xargs -P "$concurrency" -L 1 sh -c '
  kind="$1"
  name="$2"
  printf "openspec: validating %s %s\\n" "$kind" "$name"
  openspec validate "$name" --type "$kind" --strict
' _
"""

[tasks."commitlint:history"]
description = "Validate every commit on the current branch with commitlint"
run = """
set -euo pipefail

commitlint_config_dir="$(mise where npm:@commitlint/config-conventional)/lib/node_modules"
export NODE_PATH="${commitlint_config_dir}${NODE_PATH:+:${NODE_PATH}}"

tmp_dir="$(mktemp -d)"
cleanup() {
  rm -f "$tmp_dir/root-message.txt"
  rmdir "$tmp_dir"
}
trap cleanup EXIT

root_sha="$(git rev-list --max-parents=0 --reverse HEAD | head -n 1)"
git log -1 --format=%B "$root_sha" > "$tmp_dir/root-message.txt"
commitlint --edit "$tmp_dir/root-message.txt"
commitlint --from "$root_sha" --to HEAD
"""

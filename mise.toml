# Also the mise release CI runs (.github/actions/setup-mise reads this field)
# and the one mise.lock is written with (`mise run lock`): bump it, then run
# `mise run lock` and commit both.
min_version = "2026.7.7"
monorepo_root = true

[settings]
experimental = true
jobs = 8
lockfile = true
npm.package_manager = "bun"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"
_.file = [{ path = ".env.local", redact = true }]

[tools]
# Also the repo's type checker (`bun check`, >= 1.4.3) and formatter (`bun fmt`,
# >= 1.4.4, configured in bunfig.toml's `[fmt]`) — see the `typecheck` and
# `format:*` tasks.
bun = "1.4.4"
# Tests/CI only: cospec itself stays node-free at runtime (every wrapped
# OpenSpec call runs under Bun — see docs/architecture.md). Node runs the few
# contract rows that need it (a leading `--` Bun would drop) and the bun-less
# standalone pack smoke. Pinned to ci-bun's runner-image Node (ubuntu-24.04
# 20260920.314 ships 22.23.2) so a local `mise run check` sees the same Node
# CI does instead of whatever mise-global node happens to be on PATH.
node = "22.23.2"
# The OpenSpec CLI cospec wraps. This mise entry is a dev/probe convenience; the
# runtime copy is the pinned `@fission-ai/openspec` package dependency of
# apps/cli, resolved by path (never $PATH) — see docs/architecture.md.
"npm:@fission-ai/openspec" = "1.13.1"
# Bun 1.4.4 has no built-in linter (`bun lint` is documented for a later
# release), so oxlint stays.
"npm:oxlint" = "1.71.0"
# Git hooks runner. >= 1.44.2 is required for the pklr cache-freshness fix
# (jdx/hk#879) so edits to hk.pkl are picked up without a manual `hk cache clear`.
"aqua:jdx/hk" = "1.48.0"
"aqua:jdx/usage" = "3.2.1"
# TOML formatter (used by the hk taplo step) — prebuilt binary via aqua. The
# cargo backend builds from source on every cache miss, which is slow and flakes
# on transient crates.io download failures. Same upstream, same `taplo` binary.
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:koalaman/shellcheck" = "0.10.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:cli/cli" = "2.91.0"
# Release-only tools (used by .github/workflows/release.yml's version + publish
# jobs). Pinned like every other tool here — see docs/release.md — so a
# dispatch is reproducible instead of resolving whatever upstream shipped that
# day. Prebuilt binaries, no source compile.
"aqua:cocogitto/cocogitto" = "7.0.0"
"github:jdx/communique" = "1.2.0"

[monorepo]
# "e2e" is a bare directory (single-level globs only per mise's monorepo docs;
# it needs no glob since it is exactly one dir). It has no package.json — it is
# not a bun/npm workspace — but config_roots has no such requirement, only a
# mise.toml at that path; verified empirically (`mise tasks --all`, `//e2e:eval`
# from root, bare `eval` from inside e2e/ all resolve).
config_roots = ["apps/*", "packages/*", "e2e"]

# Scripts in scripts/mise-tasks/ are invoked directly by toml tasks
# (run = "bash scripts/mise-tasks/..."). An empty includes list stops mise from
# auto-discovering them as duplicate tasks, so toml description fields stay
# authoritative in `mise tasks ls`.
[task_config]
includes = []

[hooks]
postinstall = "hk install --mise"

# ───────────────────────────────────────────────
# cospec entrypoint
# ───────────────────────────────────────────────

[tasks.cospec]
description = "Run cospec from source (mise run cospec -- <args>)"
run = "bun run apps/cli/src/index.ts --"

# ───────────────────────────────────────────────
# Thin root aliases — project-scoped tasks now live in each config root's own
# mise.toml (apps/cli, apps/docs, packages/bench, e2e); these forward to them
# by monorepo address (`//path:task`) so every existing `mise run <name>`
# invocation (CI workflows, hk.pkl, docs, muscle memory) keeps working
# unchanged. Run the same task without the alias via `//path:task` from
# anywhere, or the bare name from inside that project's directory.
# ───────────────────────────────────────────────

[tasks.build]
description = "Build the cospec single-file executable (local convenience)"
run = "mise run //apps/cli:build"

[tasks.test]
description = "Run unit tests"
run = "mise run //apps/cli:test"

[tasks."test:contract"]
description = "Contract tests against the real pinned openspec binary"
run = "mise run //apps/cli:test:contract"

[tasks."test:integration"]
description = "Integration tests over the 3 repo states + lifecycles"
run = "mise run //apps/cli:test:integration"

[tasks."test:changed"]
description = "Run the unit/contract/integration tests a change reaches (mise run test:changed -- [--base <ref> | --staged | --push] <suite>...; the hooks' and PR CI's scope)"
run = "mise run //apps/cli:test:changed"

[tasks."test:pack"]
description = "Pack smoke: bun pm pack -> tarball install -> bunx cospec"
run = "mise run //apps/cli:test:pack"

[tasks."test:pack:standalone"]
description = "Bun-less standalone smoke: build host platform package, npm-install launcher + binary with bun stripped from PATH, run cospec"
run = "mise run //apps/cli:test:pack:standalone"

[tasks."test:release"]
description = "Test the release:set-version script against a throwaway --root (no working-tree mutation)"
run = "mise run //e2e:release-test"

[tasks."docs:dev"]
description = "Run the docs site dev server (VitePress)"
run = "mise run //apps/docs:dev"

[tasks."docs:build"]
description = "Build the docs site for production (VitePress)"
run = "mise run //apps/docs:build"

[tasks.bench]
description = "Run the full cospec-vs-openspec benchmark matrix (advisory, never gates CI)"
run = "mise run //packages/bench:bench"

[tasks."bench:smoke"]
description = "Single cheap bench cell: ci scenario, sonnet-5/high, cospec arm (advisory, never gates CI)"
run = "mise run //packages/bench:smoke"

[tasks."test:bench"]
description = "Unit tests for the packages/bench harness (matrix, mechanical, report, judge, scenario registry) — no auth/network required"
run = "mise run //packages/bench:test"

[tasks."eval:e2e"]
description = "DeepSeek E2E eval of the shipped skills (advisory, never gates CI)"
run = "mise run //e2e:eval"

# ───────────────────────────────────────────────
# Lint / format
# ───────────────────────────────────────────────

[tasks.lint]
description = "Lint all TypeScript/JavaScript with oxlint"
run = "oxlint ."

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "oxlint --fix ."

[tasks."format:check"]
description = "Check formatting with bun fmt — exits non-zero if any file differs"
run = "bun fmt --check ."

[tasks."format:fix"]
description = "Format all files in place with bun fmt"
run = "bun fmt ."

[tasks.typecheck]
description = "Type-check all workspaces (apps/*, packages/*) and the e2e eval sources with bun check"
run = ["bun run --filter '*' typecheck", "bun check -p e2e/tsconfig.json"]

# ───────────────────────────────────────────────
# Generate (canon -> managed files) + drift gate
# ───────────────────────────────────────────────

# Both run with HOME and the machine-global config at an empty directory (scripts/generate-self):
# the repo's managed files are the same skills and commands whatever `delivery` the host's config
# sets, and a home-scoped skills root (~/.minimax) the host holds is neither drift-checked nor
# rewritten.
[tasks.generate]
description = "Regenerate managed files from canon (self-repo)"
run = "bash scripts/generate-self update"

[tasks."generate:check"]
description = "Fail if any managed file drifts from canon (CI/pre-commit gate)"
run = "bash scripts/generate-self update --check"

[tasks.lock]
description = "Regenerate mise.lock with the mise release min_version names (the one CI pins)"
run = "bash scripts/mise-tasks/lock"

[tasks."lock:check"]
description = "Fail if mise.lock is not what the min_version mise release writes (CI/check gate)"
run = "bash scripts/mise-tasks/lock --check"

[tasks."vendor:openspec"]
description = "Regenerate the vendored self-contained openspec bundle the compiled binary embeds"
run = "bash scripts/mise-tasks/vendor/openspec"

[tasks."vendor:openspec:check"]
description = "Fail if the committed openspec bundle drifts from a fresh build of the pin"
run = "bash scripts/mise-tasks/vendor/openspec --check"

[tasks."openspec:schema:validate"]
description = "Structurally validate each composed schema with the raw openspec CLI"
run = """
set -eu
for t in build chore ci docs feat fix perf refactor revert style test; do
  echo "openspec schema validate $t"
  openspec schema validate "$t"
done
"""

[tasks."cospec-validate-all"]
description = "Strictly validate every change and spec in this repo"
run = "mise run cospec -- validate --all --strict"

# ───────────────────────────────────────────────
# Agent context sync
# ───────────────────────────────────────────────

[tasks."agents:sync"]
description = "Rewrite the shared block in CLAUDE.md/AGENTS.md from .agents/shared.md"
run = "bash scripts/mise-tasks/agents/sync"

[tasks."agents:check"]
description = "Fail if CLAUDE.md/AGENTS.md drift from .agents/shared.md"
run = "bash scripts/mise-tasks/agents/sync --check"

# ───────────────────────────────────────────────
# Commit / PR title linting
# ───────────────────────────────────────────────

[tasks."commit:check-title"]
description = "Lint a PR/commit title (PR_TITLE env) against commitlint"
run = 'printf "%s\n" "$PR_TITLE" | bunx commitlint'

# ───────────────────────────────────────────────
# Release
# ───────────────────────────────────────────────

[tasks."release:set-version"]
description = "Stamp ONE release version (semver) into apps/cli/package.json and its bun.lock workspace entry. Idempotent. Usage: mise run release:set-version -- 1.2.3"
run = "bash scripts/mise-tasks/release/set-version"

# ───────────────────────────────────────────────
# Composed CI gate
# ───────────────────────────────────────────────

[tasks.check]
description = "Full CI gate: lint + format + typecheck + tests + drift + openspec validation"
depends = [
  "lint",
  "format:check",
  "typecheck",
  "check:tests",
  "generate:check",
  "lock:check",
  "vendor:openspec:check",
  "agents:check",
  "cospec-validate-all",
  "openspec:schema:validate",
]

# The test suites run one after another, not side by side as check's other dependencies do: each
# apps/cli suite runs its files in parallel, a worker per core, so suites run together would
# oversubscribe the cores and time out the bench's timing-sensitive rows.
[tasks."check:tests"]
description = "Every test suite, one after another (each apps/cli suite runs its files in parallel)"
run = [
  { task = "//apps/cli:test" },
  { task = "//apps/cli:test:contract" },
  { task = "//apps/cli:test:integration" },
  { task = "//packages/bench:test" },
  { task = "//e2e:release-test" },
]
